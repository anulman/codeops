name: CodeOps CI

on:
  pull_request:
    paths:
      - ".github/workflows/codeops-ci.yml"
      - "Dockerfile"
      - "packages/codeops-contracts/**"
      - "services/codeops-orchestrator/**"
      - "services/codeops-session-gateway/**"
      - "services/codeops-plane-controller/**"
      - "services/codeops-control-gateway/**"
      - "services/codeops-agent/**"
      - "AGENTS.md"
      - "docs/agent-context/**"
      - "infra/docker/codeops-*.Dockerfile"
      - "infra/docker/codeops-*.Dockerfile.dockerignore"
      - "infra/ci/images.json"
      - "infra/scripts/ci-image-plan.mjs"
      - "infra/scripts/test-ci-image-plan.mjs"
      - "infra/scripts/check-codeops-workflow.mjs"
      - "infra/scripts/check-codeops-manifests.mjs"
      - "infra/scripts/codeops-capacity.mjs"
      - "infra/scripts/check-codeops-capacity.mjs"
      - "infra/scripts/test-codeops-capacity.mjs"
      - "infra/scripts/codeops-bootstrap-policy.mjs"
      - "infra/scripts/check-codeops-bootstrap-plan.mjs"
      - "infra/scripts/test-codeops-bootstrap-policy.mjs"
      - "infra/scripts/test-codeops-plane-chart.mjs"
      - "infra/scripts/codeops-plane-images.mjs"
      - "infra/scripts/rewrite-codeops-plane-images.mjs"
      - "infra/scripts/test-codeops-plane-images.mjs"
      - "infra/scripts/check-codeops-plane-render.sh"
      - "infra/scripts/codeops-runtime-render.mjs"
      - "infra/scripts/render-codeops-orchestrator.mjs"
      - "infra/scripts/test-codeops-temporal-runtime.mjs"
      - "infra/scripts/codeops-cluster-build-render.mjs"
      - "infra/scripts/render-codeops-cluster-registry.mjs"
      - "infra/scripts/render-codeops-cluster-image-builder.mjs"
      - "infra/scripts/test-codeops-cluster-build.mjs"
      - "infra/scripts/codeops-agent-job-render.mjs"
      - "infra/scripts/render-codeops-agent-job.mjs"
      - "infra/scripts/test-codeops-agent-job.mjs"
      - "infra/scripts/codeops-codex-auth-render.mjs"
      - "infra/scripts/render-codeops-codex-auth.mjs"
      - "infra/scripts/test-codeops-codex-auth.mjs"
      - "infra/k8s/codeops/trial0/**"
      - "package.json"
      - "lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/codeops-ci.yml"
      - "Dockerfile"
      - "packages/codeops-contracts/**"
      - "services/codeops-orchestrator/**"
      - "services/codeops-session-gateway/**"
      - "services/codeops-plane-controller/**"
      - "services/codeops-control-gateway/**"
      - "services/codeops-agent/**"
      - "AGENTS.md"
      - "docs/agent-context/**"
      - "infra/docker/codeops-*.Dockerfile"
      - "infra/docker/codeops-*.Dockerfile.dockerignore"
      - "infra/ci/images.json"
      - "infra/scripts/ci-image-plan.mjs"
      - "infra/scripts/test-ci-image-plan.mjs"
      - "infra/scripts/check-codeops-workflow.mjs"
      - "infra/scripts/check-codeops-manifests.mjs"
      - "infra/scripts/codeops-capacity.mjs"
      - "infra/scripts/check-codeops-capacity.mjs"
      - "infra/scripts/test-codeops-capacity.mjs"
      - "infra/scripts/codeops-bootstrap-policy.mjs"
      - "infra/scripts/check-codeops-bootstrap-plan.mjs"
      - "infra/scripts/test-codeops-bootstrap-policy.mjs"
      - "infra/scripts/test-codeops-plane-chart.mjs"
      - "infra/scripts/codeops-plane-images.mjs"
      - "infra/scripts/rewrite-codeops-plane-images.mjs"
      - "infra/scripts/test-codeops-plane-images.mjs"
      - "infra/scripts/check-codeops-plane-render.sh"
      - "infra/scripts/codeops-runtime-render.mjs"
      - "infra/scripts/render-codeops-orchestrator.mjs"
      - "infra/scripts/test-codeops-temporal-runtime.mjs"
      - "infra/scripts/codeops-cluster-build-render.mjs"
      - "infra/scripts/render-codeops-cluster-registry.mjs"
      - "infra/scripts/render-codeops-cluster-image-builder.mjs"
      - "infra/scripts/test-codeops-cluster-build.mjs"
      - "infra/scripts/codeops-agent-job-render.mjs"
      - "infra/scripts/render-codeops-agent-job.mjs"
      - "infra/scripts/test-codeops-agent-job.mjs"
      - "infra/scripts/codeops-codex-auth-render.mjs"
      - "infra/scripts/render-codeops-codex-auth.mjs"
      - "infra/scripts/test-codeops-codex-auth.mjs"
      - "infra/k8s/codeops/trial0/**"
      - "package.json"
      - "lock.yaml"

permissions:
  contents: read

concurrency:
  group: codeops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Nub
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://nubjs.com/install.sh | bash -s -- 0.1.11
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Test contracts
        run: nub run --filter @renoconcierge/codeops-contracts test

      - name: Typecheck contracts
        run: nub run --filter @renoconcierge/codeops-contracts typecheck

      - name: Build contracts
        run: nub run --filter @renoconcierge/codeops-contracts build

      - name: Test and bundle Temporal orchestrator
        run: npm ci --workspaces=false --prefix services/codeops-orchestrator && npm test --prefix services/codeops-orchestrator

      - name: Typecheck Temporal orchestrator
        run: npm run typecheck --prefix services/codeops-orchestrator

      - name: Test and typecheck ACP session gateway
        run: |
          npm ci --workspaces=false --prefix services/codeops-session-gateway
          npm test --prefix services/codeops-session-gateway
          npm run typecheck --prefix services/codeops-session-gateway

      - name: Test and typecheck Plane research admission controller
        run: |
          npm ci --workspaces=false --prefix services/codeops-plane-controller
          npm test --prefix services/codeops-plane-controller
          npm run typecheck --prefix services/codeops-plane-controller

      - name: Test and typecheck trusted control gateway
        run: |
          npm ci --workspaces=false --prefix services/codeops-control-gateway
          npm test --prefix services/codeops-control-gateway
          npm run typecheck --prefix services/codeops-control-gateway

      - name: Verify pinned ACP agent adapter
        run: |
          npm ci --workspaces=false --prefix services/codeops-agent
          npm test --prefix services/codeops-agent

      - name: Build isolated ACP runtime images
        run: |
          docker build \
            --file infra/docker/codeops-agent.Dockerfile \
            --tag codeops-agent:ci \
            .
          docker build \
            --file infra/docker/codeops-session-gateway.Dockerfile \
            --tag codeops-session-gateway:ci \
            .

      - name: Build privileged Plane controller image
        run: |
          docker build \
            --file infra/docker/codeops-plane-controller.Dockerfile \
            --tag codeops-plane-controller:ci \
            .

      - name: Build privileged control gateway image
        run: |
          docker build \
            --file infra/docker/codeops-control-gateway.Dockerfile \
            --tag codeops-control-gateway:ci \
            .

      - name: Verify trusted release image plan
        run: node infra/scripts/test-ci-image-plan.mjs

      - name: Verify independent product and internal release routing
        run: node --test infra/scripts/test-release-scope.mjs

      - name: Validate workflow syntax
        run: node infra/scripts/check-codeops-workflow.mjs

      - name: Test Trial 0 capacity gate
        run: node --test infra/scripts/test-codeops-capacity.mjs

      - name: Test Trial 0 bootstrap deployment policy
        run: node --test infra/scripts/test-codeops-bootstrap-policy.mjs

      - name: Test Trial 0 Plane chart contract
        run: node --test infra/scripts/test-codeops-plane-chart.mjs

      - name: Test Trial 0 Plane immutable image rewrite
        run: node --test infra/scripts/test-codeops-plane-images.mjs

      - name: Render pinned Trial 0 Plane chart with immutable images
        run: bash infra/scripts/check-codeops-plane-render.sh

      - name: Test Trial 0 Temporal and orchestrator runtime
        run: node --test infra/scripts/test-codeops-temporal-runtime.mjs

      - name: Render Trial 0 orchestrator with an immutable image
        env:
          CODEOPS_ORCHESTRATOR_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          node infra/scripts/render-codeops-orchestrator.mjs > /tmp/codeops-orchestrator.yaml
          node infra/scripts/check-codeops-manifests.mjs \
            infra/k8s/codeops/trial0/temporal.yaml \
            /tmp/codeops-orchestrator.yaml

      - name: Test and render the Trial 0 Plane controller
        env:
          CODEOPS_PLANE_CONTROLLER_DIGEST: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          CODEOPS_CONTROL_PLANE_SHA: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CODEOPS_PLANE_CONTROLLER_HOST: work.renoconcierge.ca
          CODEOPS_PLANE_WORKSPACE_SLUG: reno-concierge
          CODEOPS_ALLOWED_HUMAN_ACTOR_IDS: 123e4567-e89b-12d3-a456-426614174000
          CODEOPS_ALLOWED_GITHUB_REVIEWER_IDS: "6723643628"
          CODEOPS_READY_STATE_ID: a23e4567-e89b-12d3-a456-426614174009
          CODEOPS_IN_PROGRESS_STATE_ID: b23e4567-e89b-12d3-a456-426614174010
          CODEOPS_NEEDS_ATTENTION_STATE_ID: c23e4567-e89b-12d3-a456-426614174011
          CODEOPS_COMPLETE_STATE_ID: d23e4567-e89b-12d3-a456-426614174012
          CODEOPS_PERSONA_USER_IDS: 323e4567-e89b-12d3-a456-426614174002=@ai-web,423e4567-e89b-12d3-a456-426614174003=@ai-security,523e4567-e89b-12d3-a456-426614174004=@ai-database,623e4567-e89b-12d3-a456-426614174005=@ai-infra,723e4567-e89b-12d3-a456-426614174006=@ai-design,823e4567-e89b-12d3-a456-426614174007=@ai-product,923e4567-e89b-12d3-a456-426614174008=@ai-ml
        run: |
          node --test infra/scripts/test-codeops-plane-controller.mjs
          node infra/scripts/render-codeops-plane-controller.mjs > /tmp/codeops-plane-controller.yaml
          node infra/scripts/check-codeops-manifests.mjs /tmp/codeops-plane-controller.yaml

      - name: Test and render the trusted control gateway
        env:
          CODEOPS_CONTROL_GATEWAY_DIGEST: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          CODEOPS_AGENT_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CODEOPS_SESSION_GATEWAY_DIGEST: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          CODEOPS_KUBERNETES_API_CIDR: 10.3.0.1/32
        run: |
          node --test infra/scripts/test-codeops-control-gateway.mjs
          node infra/scripts/render-codeops-control-gateway.mjs > /tmp/codeops-control-gateway.yaml
          node infra/scripts/check-codeops-manifests.mjs /tmp/codeops-control-gateway.yaml

      - name: Test and render the scoped cluster-native image path
        env:
          CODEOPS_BASE_SHA: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CODEOPS_REGISTRY_HOST: registry-bbbbbbbbbbbb.preview.renoconcierge.ca
        run: |
          node --test infra/scripts/test-codeops-cluster-build.mjs
          node infra/scripts/render-codeops-cluster-registry.mjs > /tmp/codeops-cluster-registry.yaml
          CODEOPS_IMAGE_KIND=orchestrator \
          CODEOPS_BUILD_ID=build-orchestrator-bbbbbbbbbbbb \
            node infra/scripts/render-codeops-cluster-image-builder.mjs > /tmp/codeops-build-orchestrator.yaml
          CODEOPS_IMAGE_KIND=plane-controller \
          CODEOPS_BUILD_ID=build-plane-controller-bbbbbbbbbbbb \
            node infra/scripts/render-codeops-cluster-image-builder.mjs > /tmp/codeops-build-plane-controller.yaml
          node infra/scripts/check-codeops-manifests.mjs \
            /tmp/codeops-cluster-registry.yaml \
            /tmp/codeops-build-orchestrator.yaml \
            /tmp/codeops-build-plane-controller.yaml

      - name: Test and render the isolated Trial 0 Agent Job
        env:
          CODEOPS_RUN_ID: routing-matrix-2fdebb4c
          CODEOPS_AGENT_ROLE: coding-agent
          CODEOPS_BASE_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CODEOPS_REPOSITORY: https://github.com/anulman/renoconcierge
          CODEOPS_AGENT_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CODEOPS_SESSION_GATEWAY_DIGEST: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          CODEOPS_PROMPT: Inspect the exact candidate and return an implementation plan.
        run: |
          node --test infra/scripts/test-codeops-agent-job.mjs
          node infra/scripts/render-codeops-agent-job.mjs > /tmp/codeops-agent-job.yaml
          node infra/scripts/check-codeops-manifests.mjs /tmp/codeops-agent-job.yaml

      - name: Test and render the credential-only Codex auth Jobs
        env:
          CODEOPS_AGENT_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          node --test infra/scripts/test-codeops-codex-auth.mjs
          CODEOPS_AUTH_ACTION=login \
            node infra/scripts/render-codeops-codex-auth.mjs > /tmp/codeops-codex-auth-login.yaml
          CODEOPS_AUTH_ACTION=smoke \
            node infra/scripts/render-codeops-codex-auth.mjs > /tmp/codeops-codex-auth-smoke.yaml
          node infra/scripts/check-codeops-manifests.mjs \
            /tmp/codeops-codex-auth-login.yaml \
            /tmp/codeops-codex-auth-smoke.yaml

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
