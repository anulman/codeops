name: Build release images

on:
  workflow_call:
    inputs:
      service_scope:
        description: Release image family to build
        required: true
        type: string
    outputs:
      image_tag:
        description: Immutable SHA tag for this release
        value: ${{ jobs.images.outputs.image_tag }}
      chatwoot_image:
        description: Repository-owned Chatwoot image, when selected
        value: ${{ jobs.images.outputs.chatwoot_image }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build durable images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.plan.outputs.image_tag }}
      build_images: ${{ steps.plan.outputs.build_images }}
      chatwoot_image: ${{ steps.plan.outputs.chatwoot_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan service image work
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node infra/scripts/ci-image-plan.mjs \
            --service-scope "${{ inputs.service_scope }}" \
            --github-output "$GITHUB_OUTPUT" \
            --plan-file image-plan.json

      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.build_images == 'true'

      - uses: docker/login-action@v3
        if: steps.plan.outputs.can_push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reclaim runner disk for Chatwoot build
        if: inputs.service_scope == 'product' && steps.plan.outputs.build_images == 'true' && steps.plan.outputs.can_push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chatwoot_input_ref="$(
            jq -r '.services[] | select(.name == "chatwoot") | .inputRef' image-plan.json
          )"

          if docker buildx imagetools inspect "$chatwoot_input_ref" >/dev/null 2>&1; then
            printf 'Chatwoot input image already exists; runner cleanup is unnecessary.\n'
            exit 0
          fi

          printf 'Chatwoot input image is missing; reclaiming hosted-runner tool space.\n'
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Build or retag service images
        if: steps.plan.outputs.build_images == 'true'
        shell: bash
        env:
          CAN_PUSH: ${{ steps.plan.outputs.can_push }}
        run: |
          set -euo pipefail
          export DOCKER_BUILD_RECORD_UPLOAD=false

          build_service_image() {
            local service="$1"
            name="$(jq -r '.name' <<< "$service")"
            context="$(jq -r '.context' <<< "$service")"
            dockerfile="$(jq -r '.dockerfile' <<< "$service")"
            target="$(jq -r '.target' <<< "$service")"
            input_ref="$(jq -r '.inputRef' <<< "$service")"
            input_hash="$(jq -r '.inputHash' <<< "$service")"
            cache_to="$(jq -r '.cacheTo' <<< "$service")"
            mapfile -t tag_refs < <(jq -r '.tagRefs[]' <<< "$service")
            mapfile -t cache_from < <(jq -r '.cacheFrom[]' <<< "$service")

            if [[ "$CAN_PUSH" == "true" ]] && docker buildx imagetools inspect "$input_ref" >/dev/null 2>&1; then
              printf 'Reusing existing content-addressed image %s\n' "$input_ref"
              create_args=()
              for tag_ref in "${tag_refs[@]}"; do
                if [[ "$tag_ref" != "$input_ref" ]]; then
                  create_args+=(--tag "$tag_ref")
                fi
              done
              if (( ${#create_args[@]} > 0 )); then
                docker buildx imagetools create "${create_args[@]}" "$input_ref"
              fi
              return 0
            fi

            if [[ "$name" == "chatwoot" ]]; then
              infra/scripts/compose-chatwoot.sh
            fi

            build_args=(
              --file "$dockerfile"
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
              --label "org.opencontainers.image.revision=${GITHUB_SHA}"
              --label "ca.renoconcierge.component=${name}"
            )
            # Keep Nub's mutable cache mounts isolated by service and exact
            # input graph. A corrupt virtual-store temp tree must not leak
            # from one service build into the next one on the same builder.
            build_args+=(--build-arg "BUILDKIT_CACHE_MOUNT_NS=${name}-${input_hash}")
            if [[ -n "$target" ]]; then
              build_args+=(--target "$target")
            fi
            for cache_ref in "${cache_from[@]}"; do
              build_args+=(--cache-from "type=registry,ref=${cache_ref}")
            done
            for tag_ref in "${tag_refs[@]}"; do
              build_args+=(--tag "$tag_ref")
            done

            if [[ "$CAN_PUSH" == "true" ]]; then
              build_args+=(--cache-to "type=registry,ref=${cache_to},mode=max" --push)
            else
              build_args+=(--load)
            fi

            docker buildx build "${build_args[@]}" "$context"
          }

          while read -r service; do
            name="$(jq -r '.name' <<< "$service")"
            printf '::group::%s image\n' "$name"
            if build_service_image "$service"; then
              printf '%s image success\n' "$name"
            else
              printf '%s image failed\n' "$name"
              printf '::endgroup::\n'
              exit 1
            fi
            printf '::endgroup::\n'
          done < <(
            jq -c '
              .services
              | sort_by(
                  if (.name | startswith("codeops-")) then 0
                  elif .name == "acceptance-runner" then 1
                  else 2
                  end
                )[]
            ' image-plan.json
          )

      - name: Verify PostgreSQL retrieval extensions
        if: steps.plan.outputs.build_images == 'true'
        shell: bash
        run: |
          set -euo pipefail
          postgres_ref="$(
            jq -r '.services[] | select(.name == "postgres") | .inputRef' image-plan.json
          )"
          infra/scripts/test-postgres-retrieval-image.sh "$postgres_ref"
