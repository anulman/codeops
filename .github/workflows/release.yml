name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - .github/workflows/release.yml
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - CONTRIBUTING.md
      - infra/charts/codeops/**
      - infra/scripts/check-codeops-license-policy.mjs
      - infra/license-policy/npm-license-overrides.json
      - infra/scripts/codeops-release-images.mjs
      - infra/scripts/codeops-release-chart.mjs
      - infra/scripts/codeops-release-consumer-lock.mjs
      - infra/scripts/codeopsctl.mjs
      - .github/actions/codeops/action.yml
      - infra/scripts/test-codeops-action.mjs
      - infra/scripts/test-codeopsctl.mjs
      - infra/scripts/test-codeops-release-consumer-lock.mjs
      - infra/scripts/test-codeops-release-chart.mjs
      - infra/scripts/test-codeops-quickstart-docs.mjs
      - infra/scripts/test-codeops-release-images.mjs
      - infra/scripts/test-codeops-release-workflow.mjs
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer release version without a v prefix
        required: true
        type: string
      publish:
        description: Publish ten images and the OCI Helm chart
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.release_identity.outputs.publish }}
      release_version: ${{ steps.release_identity.outputs.release_version }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate release identity
        id: release_identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          release_version=0.0.0
          publish=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$SOURCE_REF" == "refs/heads/main" ]]
              release_version="$INPUT_VERSION"
              publish="$INPUT_PUBLISH"
              ;;
            push)
              case "$SOURCE_REF" in
                refs/heads/main) ;;
                refs/tags/v*)
                  release_version="${SOURCE_REF#refs/tags/v}"
                  publish=true
                  [[ "$SOURCE_SHA" == "$(git rev-parse refs/remotes/origin/main)" ]]
                  ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$publish" == "true" || "$publish" == "false" ]]
          printf 'release_version=%s\npublish=%s\n' "$release_version" "$publish" >> "$GITHUB_OUTPUT"

      - name: Install Nub
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output /tmp/nub-install.sh \
            https://nubjs.com/install.sh
          echo "dd263aba5655a47d9e287cfff96775a856200f0ba20b916fc2919219a33db0dd  /tmp/nub-install.sh" \
            | sha256sum --check --strict
          NUB_NO_MODIFY_PATH=1 bash /tmp/nub-install.sh 0.1.11
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Verify exact source tree
        run: nub run verify

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.release_identity.outputs.publish == 'true'

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        if: steps.release_identity.outputs.publish == 'true'
        with:
          version: v3.19.2

      - name: Authenticate image publication preflight
        if: steps.release_identity.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate chart publication preflight
        if: steps.release_identity.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Reject artifact identity reuse
        if: steps.release_identity.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_identity.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            printf 'refusing to overwrite existing GitHub Release v%s\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
          names=(acceptance-runner agent agents-ui control-gateway model-proxy orchestrator plane-controller session-control-gateway session-gateway session-runtime-worker)
          for name in "${names[@]}"; do
            ref="ghcr.io/anulman/codeops/${name}:sha-${SOURCE_SHA}"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              printf 'refusing to overwrite existing image identity %s\n' "$ref" >&2
              exit 1
            fi
          done
          if helm show chart oci://ghcr.io/anulman/codeops/charts/codeops --version "$RELEASE_VERSION" >/dev/null 2>&1; then
            printf 'refusing to overwrite existing chart version %s\n' "$RELEASE_VERSION" >&2
            exit 1
          fi

  images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - acceptance-runner
          - agent
          - agents-ui
          - control-gateway
          - model-proxy
          - orchestrator
          - plane-controller
          - session-control-gateway
          - session-gateway
          - session-runtime-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build exact image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/codeops-${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.validate.outputs.publish == 'true' }}
          load: ${{ needs.validate.outputs.publish != 'true' }}
          tags: ghcr.io/anulman/codeops/${{ matrix.image }}:sha-${{ github.sha }}
          provenance: ${{ needs.validate.outputs.publish == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.validate.outputs.publish == 'true' }}

      - name: Install checksum-verified Syft
        env:
          SYFT_VERSION: 1.50.0
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/syft-checksums.txt "${base}/syft_${SYFT_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "/tmp/${archive}" "${base}/${archive}"
          (cd /tmp && grep "  ${archive}$" syft-checksums.txt | sha256sum --check --strict)
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp syft
          sudo install --mode 0755 /tmp/syft /usr/local/bin/syft
          [[ "$(syft version -o json | jq -r .version)" == "$SYFT_VERSION" ]]

      - name: Generate exact image SPDX SBOM
        env:
          IMAGE_SOURCE: ${{ needs.validate.outputs.publish == 'true' && 'registry' || 'docker' }}
        run: |
          set -euo pipefail
          image="ghcr.io/anulman/codeops/${{ matrix.image }}:sha-${{ github.sha }}"
          syft scan "${IMAGE_SOURCE}:${image}" \
            --output "spdx-json=sbom-${{ matrix.image }}.spdx.json"

      - name: Enforce exact image license policy
        run: >-
          node infra/scripts/check-codeops-license-policy.mjs
          --sbom sbom-${{ matrix.image }}.spdx.json
          --report license-policy-${{ matrix.image }}.json
          --subject ${{ matrix.image }}

      - name: Retain exact image license evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeops-license-${{ matrix.image }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            sbom-${{ matrix.image }}.spdx.json
            license-policy-${{ matrix.image }}.json

  chart:
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.19.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Nub
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output /tmp/nub-install.sh \
            https://nubjs.com/install.sh
          echo "dd263aba5655a47d9e287cfff96775a856200f0ba20b916fc2919219a33db0dd  /tmp/nub-install.sh" \
            | sha256sum --check --strict
          NUB_NO_MODIFY_PATH=1 bash /tmp/nub-install.sh 0.1.11
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Authenticate Helm to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Authenticate Docker to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable release image manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          POSTGRES_DIGEST: sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const names = ["acceptance-runner","agent","agents-ui","control-gateway","model-proxy","orchestrator","plane-controller","session-control-gateway","session-gateway","session-runtime-worker"];
            const sourceSha = process.env.SOURCE_SHA;
            const services = names.map((name) => ({ name, repository: `ghcr.io/anulman/codeops/${name}`, sourceRef: `ghcr.io/anulman/codeops/${name}:sha-${sourceSha}` }));
            writeFileSync("image-plan.json", JSON.stringify({ version: "codeops.image-publication-plan/v1", sourceSha, upstream: { postgresql: { repository: "postgres", digest: process.env.POSTGRES_DIGEST } }, services }, null, 2));
          '
          node infra/scripts/codeops-release-images.mjs image-plan.json release-manifest.json values.release.yaml

      - name: Resolve locked chart dependencies
        run: nub run prepare:chart

      - name: Embed immutable release identity in chart
        run: node infra/scripts/codeops-release-chart.mjs infra/charts/codeops values.release.yaml .release/chart

      - name: Download exact image license evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codeops-license-*-${{ github.sha }}
          path: .release/license-evidence
          merge-multiple: true

      - name: Verify complete image license evidence
        run: |
          set -euo pipefail
          names=(acceptance-runner agent agents-ui control-gateway model-proxy orchestrator plane-controller session-control-gateway session-gateway session-runtime-worker)
          for name in "${names[@]}"; do
            test -s ".release/license-evidence/sbom-${name}.spdx.json"
            test -s ".release/license-evidence/license-policy-${name}.json"
            jq -e --arg subject "$name" '.schema == "codeops.license-policy-report/v1" and .subject == $subject and .policy.result == "pass"' \
              ".release/license-evidence/license-policy-${name}.json" >/dev/null
          done

      - name: Package and publish OCI chart
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          helm package .release/chart --version "$RELEASE_VERSION" --app-version "$SOURCE_SHA" --destination .release
          push_output=$(helm push ".release/codeops-${RELEASE_VERSION}.tgz" oci://ghcr.io/anulman/codeops/charts 2>&1)
          printf '%s\n' "$push_output"
          chart_digest=$(printf '%s\n' "$push_output" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p')
          [[ "$chart_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          CHART_DIGEST="$chart_digest" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "release-manifest.json";
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            manifest.chart = { repository: "oci://ghcr.io/anulman/codeops/charts/codeops", version: process.env.RELEASE_VERSION, digest: process.env.CHART_DIGEST, immutableRef: `oci://ghcr.io/anulman/codeops/charts/codeops@${process.env.CHART_DIGEST}` };
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          '

      - name: Attest packaged chart
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: .release/codeops-${{ needs.validate.outputs.release_version }}.tgz

      - name: Write release checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p .release/evidence
          cp \
            ".release/codeops-${RELEASE_VERSION}.tgz" \
            image-plan.json \
            release-manifest.json \
            values.release.yaml \
            .release/evidence/
          cp infra/scripts/codeopsctl.mjs .release/evidence/codeopsctl.mjs
          RELEASE_TAG="v${RELEASE_VERSION}" \
            node infra/scripts/codeops-release-consumer-lock.mjs \
              ".release/codeops-${RELEASE_VERSION}.tgz" \
              release-manifest.json \
              .release/evidence/codeops-consumer-lock.json
          cp .release/license-evidence/* .release/evidence/
          (
            cd .release/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
          )

      - name: Retain exact release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeops-release-${{ needs.validate.outputs.release_version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: .release/evidence/*

  registry-install:
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.19.2

      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.36.1

      - name: Install kind
        env:
          KIND_VERSION: v0.32.0
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo /tmp/kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          (cd /tmp && sha256sum --check kind.sha256sum)
          sudo install /tmp/kind-linux-amd64 /usr/local/bin/kind

      - name: Create disposable cluster
        run: |
          kind create cluster --name codeops-registry --image kindest/node:v1.36.1 --wait 120s
          kubectl label node --all codeops.dev/operator=true
          kubectl label node --all renoconcierge.ca/codeops=true

      - name: Download exact release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codeops-release-${{ needs.validate.outputs.release_version }}-${{ github.sha }}
          path: /tmp/codeops-release

      - name: Verify anonymous registry access
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          set -euo pipefail
          anonymous_root=$(mktemp -d)
          mkdir -p \
            "${anonymous_root}/home/.config/helm/registry" \
            "${anonymous_root}/docker"
          printf '{"auths":{}}\n' \
            > "${anonymous_root}/home/.config/helm/registry/config.json"
          printf '{"auths":{}}\n' > "${anonymous_root}/docker/config.json"
          export HOME="${anonymous_root}/home"
          export DOCKER_CONFIG="${anonymous_root}/docker"
          export HELM_REGISTRY_CONFIG="${anonymous_root}/home/.config/helm/registry/config.json"

          mkdir -p /tmp/codeops-registry-proof
          pull_output=$(helm pull \
            oci://ghcr.io/anulman/codeops/charts/codeops \
            --version "$RELEASE_VERSION" \
            --destination /tmp/codeops-registry-proof 2>&1)
          printf '%s\n' "$pull_output"

          jq -r '.images | to_entries[] | [.key, .value.repository, .value.digest] | @tsv' \
            /tmp/codeops-release/release-manifest.json |
            while IFS=$'\t' read -r name repository digest; do
              registry_path="${repository#ghcr.io/}"
              token=$(curl --fail --silent --show-error \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${registry_path}:pull" |
                jq -er '.token')
              status=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${token}" \
                --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/${registry_path}/manifests/${digest}")
              [[ "$status" == "200" ]] || {
                printf '%s is not anonymously pullable: HTTP %s\n' "$name" "$status" >&2
                exit 1
              }
            done

      - name: Create isolated quickstart values
        run: |
          set -euo pipefail
          api_ip=$(kubectl get service kubernetes --output jsonpath='{.spec.clusterIP}')
          API_IP="$api_ip" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const values = {
              profile: "custom",
              nodeSelector: { "renoconcierge.ca/codeops": "true" },
              agentsUi: { access: { issuer: "https://example.cloudflareaccess.com" } },
              controlGateway: { kubernetesApiCidrs: [`${process.env.API_IP}/32`] },
              temporal: { enabled: false, driver: "none", deployment: "none" },
              jetstream: { enabled: false, driver: "none", deployment: "none" },
              plane: {
                enabled: false,
                deployment: "none",
                adapter: { enabled: false, onboardingRequired: false },
              },
              quickstart: {
                enabled: true,
                openaiApiKey: "proof-openai-key-00000000000000000001",
                access: {
                  audience: "proof-cloudflare-access-audience",
                  allowedEmails: ["operator@example.com"],
                },
                repository: {
                  identity: "example/codeops-proof",
                  github: {
                    readToken: "proof-github-read-token-000000000000001",
                    writeToken: "proof-github-write-token-00000000000001",
                    webhookSecret: "proof-github-webhook-secret-00000000001",
                    reviewerIds: [12345678],
                  },
                  plane: {
                    apiOrigin: "https://plane.example.com",
                    workspaceSlug: "engineering",
                    workspaceId: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
                    projectId: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb",
                    apiKey: "proof-plane-api-key-000000000000000001",
                    webhookSecret: "proof-plane-webhook-secret-00000000001",
                    humanActorIds: ["cccccccc-cccc-4ccc-8ccc-cccccccccccc"],
                    stateIds: {
                      ready: "dddddddd-dddd-4ddd-8ddd-dddddddddddd",
                      inProgress: "eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee",
                      needsAttention: "ffffffff-ffff-4fff-8fff-ffffffffffff",
                      complete: "11111111-1111-4111-8111-111111111111",
                    },
                    personas: [
                      { handle: "@ai-web", userId: "20000000-0000-4000-8000-000000000001" },
                      { handle: "@ai-security", userId: "20000000-0000-4000-8000-000000000002" },
                      { handle: "@ai-database", userId: "20000000-0000-4000-8000-000000000003" },
                      { handle: "@ai-infra", userId: "20000000-0000-4000-8000-000000000004" },
                      { handle: "@ai-design", userId: "20000000-0000-4000-8000-000000000005" },
                      { handle: "@ai-product", userId: "20000000-0000-4000-8000-000000000006" },
                      { handle: "@ai-ml", userId: "20000000-0000-4000-8000-000000000007" },
                    ],
                  },
                  context: {
                    directory: "codeops-proof",
                    agents: "# Agent instructions\nUse the repository instructions.",
                    currentState: "# Current state\nThis proof repository is active.",
                    decisions: "# Decisions\nKeep authority fail closed.",
                    domain: "# Domain\nThe repository contains one proof service.",
                    product: "# Product\nThe fixture validates registry onboarding.",
                    sourceMap: "# Source map\nApplication sources are under src/.",
                    soul: "# Soul\nUse short, direct technical language.",
                  },
                },
              },
            };
            writeFileSync("/tmp/codeops-quickstart.json", `${JSON.stringify(values)}\n`, { mode: 0o600 });
            writeFileSync("/tmp/codeops-consumer-policy.json", `${JSON.stringify({
              schemaVersion: "codeops.consumer-policy/v1",
              helmTimeout: "20m",
              httpTimeoutMs: 15000,
              requiredSecrets: [],
              cluster: {
                kubernetesServiceCidrs: [`${process.env.API_IP}/32`],
                readyNodeSelector: "codeops.dev/operator=true",
              },
              postDeployHttpChecks: [],
            })}\n`, { mode: 0o600 });
          '

      - name: Install only from the OCI registry
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
          HOME: /tmp/codeops-anonymous-home
          DOCKER_CONFIG: /tmp/codeops-anonymous-docker
          HELM_REGISTRY_CONFIG: /tmp/codeops-anonymous-home/.config/helm/registry/config.json
          KUBECONFIG: /home/runner/.kube/config
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/helm/registry" "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$HELM_REGISTRY_CONFIG"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          mkdir -p /tmp/codeops-registry-proof
          pull_output=$(helm pull oci://ghcr.io/anulman/codeops/charts/codeops --version "$RELEASE_VERSION" --destination /tmp/codeops-registry-proof 2>&1)
          printf '%s\n' "$pull_output"
          pulled_digest=$(printf '%s\n' "$pull_output" | sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p')
          [[ "$pulled_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(helm show chart "/tmp/codeops-registry-proof/codeops-${RELEASE_VERSION}.tgz" | sed -n 's/^version: //p')" == "$RELEASE_VERSION" ]]
          [[ "$(helm show chart "/tmp/codeops-registry-proof/codeops-${RELEASE_VERSION}.tgz" | sed -n 's/^appVersion: //p')" == "$SOURCE_SHA" ]]
          node /tmp/codeops-release/codeopsctl.mjs deploy \
            --lock /tmp/codeops-release/codeops-consumer-lock.json \
            --values /tmp/codeops-quickstart.json \
            --policy /tmp/codeops-consumer-policy.json \
            --release proof-system \
            --namespace proof-system \
            --chart-path "/tmp/codeops-registry-proof/codeops-${RELEASE_VERSION}.tgz" \
            --manifest-path /tmp/codeops-release/release-manifest.json
          [[ "$(helm status proof-system --namespace proof-system --output json | jq -r .info.status)" == "deployed" ]]
          kubectl wait --namespace proof-system --for=condition=Available deployment --all --timeout=5m
          kubectl get deployment --namespace proof-system --output json | jq -e --argjson expected '[
            "ghcr.io/anulman/codeops/agents-ui",
            "ghcr.io/anulman/codeops/control-gateway",
            "ghcr.io/anulman/codeops/model-proxy",
            "ghcr.io/anulman/codeops/session-control-gateway"
          ]' '
            [.items[].spec.template.spec.containers[].image]
            | map(select(startswith("ghcr.io/anulman/codeops/"))) as $images
            | ($images | all(test("@sha256:[0-9a-f]{64}$")))
              and (($images | map(sub("@sha256:[0-9a-f]{64}$"; "")) | unique | sort) == $expected)
          '
          prior_revision=$(helm list --namespace proof-system --filter '^proof-system$' --output json \
            | jq -er 'map(select(.name == "proof-system")) | if length == 1 then .[0].revision else error("expected one release") end')
          jq '.httpTimeoutMs = 1000 | .postDeployHttpChecks = [{url:"https://127.0.0.1:1",acceptedStatuses:[200]}]' \
            /tmp/codeops-consumer-policy.json > /tmp/codeops-rollback-policy.json
          if node /tmp/codeops-release/codeopsctl.mjs deploy \
            --lock /tmp/codeops-release/codeops-consumer-lock.json \
            --values /tmp/codeops-quickstart.json \
            --policy /tmp/codeops-rollback-policy.json \
            --release proof-system \
            --namespace proof-system \
            --chart-path "/tmp/codeops-registry-proof/codeops-${RELEASE_VERSION}.tgz" \
            --manifest-path /tmp/codeops-release/release-manifest.json; then
            echo "post-deploy failure proof unexpectedly passed" >&2
            exit 1
          fi
          restored=$(helm list --namespace proof-system --filter '^proof-system$' --output json \
            | jq -ec 'map(select(.name == "proof-system")) | if length == 1 then .[0] else error("expected one release") end')
          [[ "$(jq -r .status <<<"$restored")" == "deployed" ]]
          [[ "$(jq -r .chart <<<"$restored")" == "codeops-${RELEASE_VERSION}" ]]
          [[ "$(jq -r .app_version <<<"$restored")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .revision <<<"$restored")" -gt "$prior_revision" ]]
          jq -n --arg version "$RELEASE_VERSION" --arg sourceSha "$SOURCE_SHA" --arg chartDigest "$pulled_digest" \
            '{version:$version,sourceSha:$sourceSha,chartDigest:$chartDigest,installStatus:"deployed",sourceCheckout:false}' \
            > /tmp/codeops-registry-proof/registry-install-evidence.json
          helm uninstall proof-system --namespace proof-system --wait --timeout 5m
          test -z "$(kubectl get deployment,statefulset,daemonset,job --namespace proof-system --output name)"

      - name: Capture registry-install diagnostics
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/codeops-registry-proof
          helm status proof-system --namespace proof-system \
            > /tmp/codeops-registry-proof/helm-status.txt 2>&1 || true
          kubectl get deployment,statefulset,job,pod,pvc --namespace proof-system --output wide \
            > /tmp/codeops-registry-proof/kubernetes-resources.txt 2>&1 || true
          kubectl get events --namespace proof-system --sort-by=.lastTimestamp \
            > /tmp/codeops-registry-proof/kubernetes-events.txt 2>&1 || true

      - name: Retain registry-install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeops-registry-install-${{ needs.validate.outputs.release_version }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 90
          path: /tmp/codeops-registry-proof/*

      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name codeops-registry

  github-release:
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, registry-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download exact release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codeops-release-${{ needs.validate.outputs.release_version }}-${{ github.sha }}
          path: release

      - name: Verify release checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS

      - name: Publish durable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "CodeOps ${tag}" \
            --generate-notes \
            release/*
