name: Release recovery

on:
  workflow_dispatch:
    inputs:
      runId:
        description: Failed release workflow run ID
        required: true
        type: string
      tag:
        description: Immutable release tag
        required: true
        type: string
      sourceSha:
        description: Exact tagged source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  rerun-failed-release-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate immutable release recovery request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.runId }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.sourceSha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" == v* ]]
          node infra/scripts/codeops-release-version.mjs "${RELEASE_TAG#v}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}")" == "$SOURCE_SHA" ]]

          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          [[ "$(jq -r .event <<<"$run")" == push ]]
          [[ "$(jq -r .status <<<"$run")" == completed ]]
          [[ "$(jq -r .conclusion <<<"$run")" == failure ]]
          [[ "$(jq -r .head_branch <<<"$run")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r .head_sha <<<"$run")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .path <<<"$run")" == .github/workflows/release.yml ]]

      - name: Retry only failed release jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.runId }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
