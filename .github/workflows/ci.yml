name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Nub
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://nubjs.com/install.sh | bash -s -- 0.1.11
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Verify workspace and Helm contracts
        run: nub run verify

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - agent
          - control-gateway
          - model-proxy
          - plane-controller
          - session-control-gateway
          - session-gateway
          - session-runtime-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/codeops-${{ matrix.image }}.Dockerfile
          push: false
          tags: codeops-${{ matrix.image }}:ci
