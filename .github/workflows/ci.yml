name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Nub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nub/bin"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output /tmp/nub.tar.gz \
            https://github.com/nubjs/nub/releases/download/v0.1.11/nub-linux-x64.tar.gz
          echo "d227290e3a45c05ff20508a961f01950c50a138b08caf76d59f403e8a721330d  /tmp/nub.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/nub.tar.gz -C /tmp
          install -m 0555 /tmp/bin/nub "$HOME/.nub/bin/nub"
          ln -s nub "$HOME/.nub/bin/nubx"
          "$HOME/.nub/bin/nub" --version
          rm -rf /tmp/nub.tar.gz /tmp/bin /tmp/runtime
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Verify workspace and Helm contracts
        run: nub run verify

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - agent
          - acceptance-runner
          - agents-ui
          - control-gateway
          - model-proxy
          - orchestrator
          - plane-controller
          - session-control-gateway
          - session-gateway
          - session-runtime-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/codeops-${{ matrix.image }}.Dockerfile
          push: false
          tags: codeops-${{ matrix.image }}:ci

  agents-ui-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Nub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nub/bin"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output /tmp/nub.tar.gz \
            https://github.com/nubjs/nub/releases/download/v0.1.11/nub-linux-x64.tar.gz
          echo "d227290e3a45c05ff20508a961f01950c50a138b08caf76d59f403e8a721330d  /tmp/nub.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/nub.tar.gz -C /tmp
          install -m 0555 /tmp/bin/nub "$HOME/.nub/bin/nub"
          ln -s nub "$HOME/.nub/bin/nubx"
          "$HOME/.nub/bin/nub" --version
          rm -rf /tmp/nub.tar.gz /tmp/bin /tmp/runtime
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Install the exact Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          mirrors=/etc/apt/apt-mirrors.txt
          test -f "$mirrors"
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            "$mirrors"
          ! grep -Fq 'azure.archive.ubuntu.com' "$mirrors"
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80codeops-network >/dev/null
          timeout --signal=TERM --kill-after=30s 10m \
            services/codeops-acceptance-runner/node_modules/.bin/playwright-core \
              install --with-deps chromium

      - name: Run the real Agents UI browser acceptance
        run: nub run acceptance:agents-ui
