name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Nub
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output /tmp/nub-install.sh \
            https://nubjs.com/install.sh
          echo "dd263aba5655a47d9e287cfff96775a856200f0ba20b916fc2919219a33db0dd  /tmp/nub-install.sh" \
            | sha256sum --check --strict
          NUB_NO_MODIFY_PATH=1 bash /tmp/nub-install.sh 0.1.11
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Verify workspace and Helm contracts
        run: nub run verify

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - agent
          - acceptance-runner
          - agents-ui
          - control-gateway
          - model-proxy
          - orchestrator
          - plane-controller
          - session-control-gateway
          - session-gateway
          - session-runtime-worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/codeops-${{ matrix.image }}.Dockerfile
          push: false
          tags: codeops-${{ matrix.image }}:ci

  agents-ui-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Nub
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 --output /tmp/nub-install.sh \
            https://nubjs.com/install.sh
          echo "dd263aba5655a47d9e287cfff96775a856200f0ba20b916fc2919219a33db0dd  /tmp/nub-install.sh" \
            | sha256sum --check --strict
          NUB_NO_MODIFY_PATH=1 bash /tmp/nub-install.sh 0.1.11
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: nub install --frozen-lockfile

      - name: Install the exact Chromium runtime
        run: services/codeops-acceptance-runner/node_modules/.bin/playwright-core install --with-deps chromium

      - name: Run the real Agents UI browser acceptance
        run: nub run acceptance:agents-ui
