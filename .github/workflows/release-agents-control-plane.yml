name: Release Agents control plane

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-agents-control-plane-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-scope:
    name: Plan Agents control plane deploy scope
    runs-on: ubuntu-latest
    outputs:
      deploy_internal: ${{ steps.scope.outputs.deploy_internal }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Plan Agents control plane release scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          force_full=false
          base=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            force_full=true
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "main" ]]; then
            base="${{ github.event.before }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi

          if [[ -n "${base}" && ! "${base}" =~ ^0+$ ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${base}" || true
          fi
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          args=(--base "${base}" --head "${GITHUB_SHA}" --github-output "${GITHUB_OUTPUT}")
          if [[ "${force_full}" == "true" ]]; then
            args+=(--force-full)
          fi
          node infra/scripts/release-scope.mjs "${args[@]}"

  images:
    name: Build Agents control plane images
    needs: release-scope
    if: needs.release-scope.outputs.deploy_internal == 'true'
    uses: ./.github/workflows/release-images.yml
    with:
      service_scope: internal
    secrets: inherit

  deploy-internal:
    name: Deploy Agents control plane
    runs-on: ubuntu-latest
    needs:
      - release-scope
      - images
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.release-scope.outputs.deploy_internal == 'true'
    environment: internal
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write internal OVH kubeconfig
        shell: bash
        env:
          OVH_KUBECONFIG: ${{ secrets.OVH_RENOCONCIERGE_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${OVH_KUBECONFIG}" ]]; then
            printf 'The internal Environment is missing OVH_RENOCONCIERGE_KUBECONFIG.\n' >&2
            exit 1
          fi
          kubeconfig="${RUNNER_TEMP}/ovh-agents-system.yaml"
          if grep -q "apiVersion:" <<< "${OVH_KUBECONFIG}"; then
            printf '%s' "${OVH_KUBECONFIG}" > "${kubeconfig}"
          else
            printf '%s' "${OVH_KUBECONFIG}" | base64 --decode > "${kubeconfig}"
          fi
          chmod 600 "${kubeconfig}"
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Resolve exact Agents control plane image digests
        shell: bash
        run: |
          set -euo pipefail
          node infra/scripts/ci-image-plan.mjs \
            --service-scope internal \
            --plan-file image-plan.json
          node infra/scripts/agents-system-release-images.mjs \
            image-plan.json \
            agents-system-release-images.json >/dev/null

      - name: Verify internal deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          namespace="agents-system"
          kubectl config current-context
          kubectl create namespace "${namespace}" --dry-run=client -o yaml | kubectl apply -f -
          missing=()
          for secret in \
            ghcr-renoconcierge \
            agents-system-postgres \
            agents-system-session-secrets \
            agents-system-access \
            agents-system-controller-secrets \
            agents-system-controller-config \
            agents-system-runtime-source \
            agents-system-model-proxy-credentials
          do
            if ! kubectl -n "${namespace}" get secret "${secret}" >/dev/null 2>&1; then
              missing+=("${secret}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Agents control plane prerequisites are missing in namespace %s:\n' "${namespace}" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

          require_keys() {
            local secret="$1"
            shift
            local document
            document="$(kubectl -n "${namespace}" get secret "${secret}" -o json)"
            for key in "$@"; do
              if ! jq -e --arg key "${key}" '.data[$key] | type == "string" and length > 0' <<< "${document}" >/dev/null; then
                printf 'Agents control plane prerequisite %s is missing key %s.\n' "${secret}" "${key}" >&2
                exit 1
              fi
            done
          }
          require_keys agents-system-postgres password
          require_keys agents-system-session-secrets \
            database-url read-token write-token runtime-worker-token \
            initialization-token github-steering-token runtime-database-url \
            runtime-database-role
          require_keys agents-system-access audience allowed-emails
          require_keys agents-system-controller-secrets \
            plane-api-key plane-webhook-secret research-projection-token \
            repository-head-token github-webhook-secret github-steering-token
          require_keys agents-system-runtime-source repository-read-token
          require_keys agents-system-model-proxy-credentials openai-api-key signing-key

          session_secret="$(kubectl -n "${namespace}" get secret agents-system-session-secrets -o json)"

          if [[ "$(jq -r '.data["database-url"]' <<< "${session_secret}")" == "$(jq -r '.data["runtime-database-url"]' <<< "${session_secret}")" ]]; then
            printf 'The runtime database URL must use a distinct receipt-only role.\n' >&2
            exit 1
          fi

      - name: Migrate and deploy Agents control plane
        shell: bash
        env:
          ACCESS_ISSUER: ${{ vars.CLOUDFLARE_ACCESS_ISSUER }}
        run: |
          set -euo pipefail
          if [[ ! "${ACCESS_ISSUER}" =~ ^https://[a-z0-9-]+\.cloudflareaccess\.com/?$ ]]; then
            printf 'The internal Environment has an invalid CLOUDFLARE_ACCESS_ISSUER.\n' >&2
            exit 1
          fi
          value() { jq -er ".images.$1.$2" agents-system-release-images.json; }
          args=(
            agents-system infra/charts/agents-system
            --namespace agents-system
            --set-string "agentsUi.image.repository=$(value agents_ui repository)"
            --set-string "agentsUi.image.digest=$(value agents_ui digest)"
            --set-string "gateway.image.repository=$(value gateway repository)"
            --set-string "gateway.image.digest=$(value gateway digest)"
            --set-string "githubController.image.repository=$(value github_controller repository)"
            --set-string "githubController.image.digest=$(value github_controller digest)"
            --set-string "githubController.controlPlaneSha=${GITHUB_SHA}"
            --set-string "postgresql.image.repository=$(value postgresql repository)"
            --set-string "postgresql.image.digest=$(value postgresql digest)"
            --set-string "runtime.workerImage.repository=$(value runtime_worker repository)"
            --set-string "runtime.workerImage.digest=$(value runtime_worker digest)"
            --set-string "runtime.agentImage.repository=$(value runtime_agent repository)"
            --set-string "runtime.agentImage.digest=$(value runtime_agent digest)"
            --set-string "modelProxy.image.repository=$(value model_proxy repository)"
            --set-string "modelProxy.image.digest=$(value model_proxy digest)"
            --set-string "agentsUi.access.issuer=${ACCESS_ISSUER%/}"
          )

          if ! helm status agents-system --namespace agents-system >/dev/null 2>&1; then
            helm upgrade --install "${args[@]}" \
              --set migration.enabled=false \
              --set agentsUi.replicas=0 \
              --set gateway.replicas=0 \
              --set githubController.replicas=0 \
              --atomic --wait --timeout 10m
            kubectl -n agents-system rollout status statefulset/agents-system-postgresql --timeout=300s
          fi

          helm upgrade "${args[@]}" \
            --set migration.enabled=true \
            --atomic --wait --wait-for-jobs --timeout 15m
          kubectl -n agents-system logs job/agents-system-session-migrate > agents-system-migration-evidence.jsonl

      - name: Run internal Agents control plane smoke
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n agents-system rollout status statefulset/agents-system-postgresql --timeout=300s
          kubectl -n agents-system rollout status deploy/agents-system-session-gateway --timeout=180s
          kubectl -n agents-system rollout status deploy/agents-system-github-controller --timeout=180s
          kubectl -n agents-system rollout status deploy/agents-system-agents-ui --timeout=180s
          kubectl -n agents-system rollout status deploy/agents-system-model-proxy --timeout=180s
          kubectl -n agents-system exec deploy/agents-system-session-gateway -- \
            node -e 'fetch("http://127.0.0.1:8080/healthz").then(async r => { if (r.status !== 200 || (await r.json()).status !== "ok") process.exit(1) })'
          kubectl -n agents-system exec deploy/agents-system-agents-ui -- \
            node -e 'fetch("http://127.0.0.1:3000/").then(r => { if (r.status !== 401) process.exit(1) })'

      - name: Verify Cloudflare Access blocks unauthenticated external traffic
        shell: bash
        env:
          ACCESS_ISSUER: ${{ vars.CLOUDFLARE_ACCESS_ISSUER }}
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-redirs 0 --dump-header "${headers}" \
            --output /dev/null --write-out '%{http_code}' https://agents.renoconcierge.ca/)"
          location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "${headers}")"
          if [[ "${status}" != "302" || "${location}" != "${ACCESS_ISSUER%/}"/* ]]; then
            printf 'Unauthenticated Access smoke was not blocked by the exact Access issuer (HTTP %s).\n' "${status}" >&2
            exit 1
          fi

      - name: Publish exact Agents control plane evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## Agents control plane release evidence\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            jq -r '.images | to_entries[] | "- " + .key + ": `" + .value.immutableRef + "`"' agents-system-release-images.json
            printf -- '- Schema migration: `%s`\n' "$(tail -n 1 agents-system-migration-evidence.jsonl | jq -er '.event')"
            printf -- '- Cloudflare Access: unauthenticated external request blocked; human success smoke required before first use\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: agents-system-release-${{ github.sha }}
          path: |
            agents-system-release-images.json
            agents-system-migration-evidence.jsonl
          if-no-files-found: error
          retention-days: 30
