# Prepared for a disposable proof cluster. NOT a migration of the live database.
# No credentials are embedded; operator-owned storage and secret provisioning
# are separate. Only the external deployment identity may bind the owner Role.
apiVersion: v1
kind: Namespace
metadata:
  name: codeops-database-owner
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: codeops-inspection
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-migration
  namespace: codeops-database-owner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-inspector
  namespace: codeops-inspection
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codeops-approved-migration-operator
  namespace: codeops-database-owner
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
# Intentionally no binding. Binding must name the live external deployment
# principal after review. It must never include a runtime or supervisor identity.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codeops-inspector-projection
  namespace: agents-system
rules:
  - apiGroups: ['']
    resources: [pods, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codeops-inspector-projection
  namespace: agents-system
subjects:
  - kind: ServiceAccount
    name: codeops-inspector
    namespace: codeops-inspection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codeops-inspector-projection
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: codeops-database-owner
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: codeops-inspection
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: codeops-database-owner
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: postgresql}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 5432}]
      from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agents-system}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [session-gateway, control-gateway, control-gateway-file-dispatcher, model-proxy, lifecycle-relay, session-runtime-worker]
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: codeops-database-owner}
          podSelector:
            matchLabels: {app.kubernetes.io/component: session-migration}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: codeops-inspection}
          podSelector:
            matchLabels: {app.kubernetes.io/component: database-inspector}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration-egress
  namespace: codeops-database-owner
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: session-migration}
  policyTypes: [Egress]
  egress:
    - ports: [{protocol: TCP, port: 5432}]
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: codeops-database-owner}
          podSelector:
            matchLabels: {app.kubernetes.io/component: postgresql}
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inspector-database-egress
  namespace: codeops-inspection
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: database-inspector}
  policyTypes: [Egress]
  egress:
    - ports: [{protocol: TCP, port: 5432}]
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: codeops-database-owner}
          podSelector:
            matchLabels: {app.kubernetes.io/component: postgresql}
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
