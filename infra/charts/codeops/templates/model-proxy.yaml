apiVersion: apps/v1
kind: Deployment
{{- if not (has .Values.modelProxy.provider.primary (list "api-key" "chatgpt-primary")) }}
{{- fail "modelProxy.provider.primary must be api-key or chatgpt-primary" }}
{{- end }}
{{- if and (eq .Values.modelProxy.provider.primary "chatgpt-primary") (ne (int .Values.modelProxy.replicas) 1) }}
{{- fail "modelProxy.replicas must be 1 for chatgpt-primary auth" }}
{{- end }}
{{- if and (eq .Values.modelProxy.provider.primary "chatgpt-primary") (empty .Values.modelProxy.provider.chatgptAuthClaimName) }}
{{- fail "modelProxy.provider.chatgptAuthClaimName is required for chatgpt-primary auth" }}
{{- end }}
metadata:
  name: {{ include "codeops.fullname" . }}-model-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-proxy
spec:
  replicas: {{ .Values.modelProxy.replicas }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" (eq .Values.modelProxy.provider.primary "chatgpt-primary") }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "codeops.fullname" . }}-model-proxy }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codeops.fullname" . }}-model-proxy
        app.kubernetes.io/component: model-proxy
        app.kubernetes.io/part-of: codeops
    spec:
      serviceAccountName: {{ include "codeops.fullname" . }}-model-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- include "codeops.imagePullSecrets" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        {{- if eq .Values.modelProxy.provider.primary "chatgpt-primary" }}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: model-proxy
          image: {{ include "codeops.image" .Values.modelProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.modelProxy.secretName }}, key: openai-api-key }
            - { name: CODEOPS_MODEL_PROVIDER_PRIMARY, value: {{ .Values.modelProxy.provider.primary | quote }} }
            - { name: CODEOPS_MODEL_API_KEY_FALLBACK, value: {{ .Values.modelProxy.provider.apiKeyFallback | quote }} }
            {{- if eq .Values.modelProxy.provider.primary "chatgpt-primary" }}
            - { name: CODEOPS_CHATGPT_AUTH_FILE, value: {{ .Values.modelProxy.provider.chatgptAuthFile | quote }} }
            {{- end }}
            - name: CODEOPS_MODEL_PROXY_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.modelProxy.secretName }}, key: signing-key }
            - name: CODEOPS_MODEL_PROXY_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.modelProxy.secretName }}, key: {{ .Values.modelProxy.databaseUrlKey }} }
            - { name: CODEOPS_MODEL_PROXY_HOST, value: 0.0.0.0 }
            - { name: CODEOPS_MODEL_PROXY_PORT, value: "8080" }
            - { name: CODEOPS_MODEL_PROXY_PRIVACY_MODE, value: strict-v1 }
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          resources:
            {{- toYaml .Values.modelProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          {{- if eq .Values.modelProxy.provider.primary "chatgpt-primary" }}
          volumeMounts:
            - name: chatgpt-auth
              mountPath: {{ dir .Values.modelProxy.provider.chatgptAuthFile | quote }}
          {{- end }}
      {{- if eq .Values.modelProxy.provider.primary "chatgpt-primary" }}
      volumes:
        - name: chatgpt-auth
          persistentVolumeClaim:
            claimName: {{ .Values.modelProxy.provider.chatgptAuthClaimName | quote }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codeops.fullname" . }}-model-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-proxy
spec:
  selector: { app.kubernetes.io/name: {{ include "codeops.fullname" . }}-model-proxy }
  ports: [{ name: http, protocol: TCP, port: 8080, targetPort: http }]
