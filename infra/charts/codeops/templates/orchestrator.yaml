apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeops.fullname" . }}-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "codeops.fullname" . }}-orchestrator }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codeops.fullname" . }}-orchestrator
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: codeops
    spec:
      serviceAccountName: {{ include "codeops.fullname" . }}-orchestrator
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- include "codeops.imagePullSecrets" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orchestrator
          image: {{ include "codeops.image" .Values.orchestrator.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: CODEOPS_TEMPORAL_ADDRESS, value: {{ required "temporal.address is required" .Values.temporal.address | quote }} }
            - { name: CODEOPS_TEMPORAL_NAMESPACE, value: {{ .Values.temporal.namespace | quote }} }
            - { name: CODEOPS_TEMPORAL_TASK_QUEUE, value: {{ .Values.temporal.taskQueue | quote }} }
            - { name: CODEOPS_AGENT_DISPATCH_ORIGIN, value: http://{{ include "codeops.fullname" . }}-control-gateway:8080 }
            - { name: CODEOPS_AGENT_DISPATCH_TOKEN_FILE, value: /var/run/secrets/{{ include "codeops.fullname" . }}-control-gateway/dispatch-token }
            - { name: CODEOPS_PUBLICATION_TOKEN_FILE, value: /var/run/secrets/{{ include "codeops.fullname" . }}-control-gateway/publication-token }
            - { name: CODEOPS_RESEARCH_PROJECTION_ORIGIN, value: http://{{ include "codeops.fullname" . }}-github-controller:8080 }
            - { name: CODEOPS_RESEARCH_PROJECTION_TOKEN_FILE, value: /var/run/secrets/{{ include "codeops.fullname" . }}-controller/research-projection-token }
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: control-gateway-auth, mountPath: /var/run/secrets/{{ include "codeops.fullname" . }}-control-gateway, readOnly: true }
            - { name: controller-auth, mountPath: /var/run/secrets/{{ include "codeops.fullname" . }}-controller, readOnly: true }
      volumes:
        - name: control-gateway-auth
          secret:
            secretName: {{ .Values.controlGateway.secretName }}
            defaultMode: 256
            items:
              - { key: dispatch-token, path: dispatch-token }
              - { key: publication-token, path: publication-token }
        - name: controller-auth
          secret:
            secretName: {{ .Values.githubController.secretName }}
            defaultMode: 256
            items:
              - { key: research-projection-token, path: research-projection-token }
