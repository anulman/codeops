{{- if eq .Values.jetstream.driver "jetstream" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeops.fullname" . }}-lifecycle-relay
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: lifecycle-relay
spec:
  replicas: {{ .Values.lifecycleRelay.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "codeops.fullname" . }}-lifecycle-relay }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codeops.fullname" . }}-lifecycle-relay
        app.kubernetes.io/component: lifecycle-relay
        app.kubernetes.io/part-of: codeops
    spec:
      serviceAccountName: {{ include "codeops.fullname" . }}-lifecycle-relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- include "codeops.imagePullSecrets" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: {{ include "codeops.image" .Values.gateway.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, services/codeops-control-gateway/dist/session-migrate-main.js]
          env:
            - { name: CODEOPS_DATABASE_URL_FILE, value: /var/run/secrets/codeops-migration/database-url }
            - { name: CODEOPS_RUNTIME_DATABASE_URL_FILE, value: /var/run/secrets/codeops-migration/runtime-database-url }
            - { name: CODEOPS_RUNTIME_DATABASE_ROLE_FILE, value: /var/run/secrets/codeops-migration/runtime-database-role }
            - { name: CODEOPS_LIFECYCLE_RELAY_DATABASE_URL_FILE, value: /var/run/secrets/codeops-relay/database-url }
            - { name: CODEOPS_LIFECYCLE_RELAY_DATABASE_ROLE_FILE, value: /var/run/secrets/codeops-relay/database-role }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: migration-authority, mountPath: /var/run/secrets/codeops-migration, readOnly: true }
            - { name: relay-authority, mountPath: /var/run/secrets/codeops-relay, readOnly: true }
            - { name: temp, mountPath: /tmp }
      containers:
        - name: lifecycle-relay
          image: {{ include "codeops.image" .Values.lifecycleRelay.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, services/codeops-control-gateway/dist/work-item-lifecycle-relay-main.js]
          env:
            - { name: CODEOPS_LIFECYCLE_RELAY_ID, value: {{ .Values.lifecycleRelay.relayId | quote }} }
            - { name: CODEOPS_LIFECYCLE_RELAY_LEASE_MS, value: {{ .Values.lifecycleRelay.leaseMs | quote }} }
            - { name: CODEOPS_LIFECYCLE_RELAY_IDLE_MS, value: {{ .Values.lifecycleRelay.idleMs | quote }} }
            - { name: CODEOPS_LIFECYCLE_RELAY_DATABASE_URL_FILE, value: /var/run/secrets/codeops-relay/database-url }
            - { name: CODEOPS_NATS_URL, value: {{ .Values.jetstream.url | quote }} }
            - { name: CODEOPS_NATS_TOKEN_FILE, value: /var/run/secrets/codeops-relay/nats-token }
            - { name: CODEOPS_JETSTREAM_STREAM, value: {{ .Values.jetstream.stream | quote }} }
            - { name: CODEOPS_JETSTREAM_SUBJECT, value: {{ .Values.jetstream.subject | quote }} }
            - { name: CODEOPS_JETSTREAM_MANAGE_STREAM, value: {{ eq .Values.jetstream.deployment "managed" | quote }} }
          readinessProbe:
            exec: { command: [test, -f, /tmp/codeops-lifecycle-relay-ready] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [test, -f, /tmp/codeops-lifecycle-relay-ready] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.lifecycleRelay.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: relay-authority, mountPath: /var/run/secrets/codeops-relay, readOnly: true }
            - { name: temp, mountPath: /tmp }
      volumes:
        - name: migration-authority
          secret:
            secretName: {{ .Values.gateway.secretName }}
            defaultMode: 256
            items:
              - { key: database-url, path: database-url }
              - { key: runtime-database-url, path: runtime-database-url }
              - { key: runtime-database-role, path: runtime-database-role }
        - name: relay-authority
          secret:
            secretName: {{ .Values.lifecycleRelay.secretName }}
            defaultMode: 256
            items:
              - { key: {{ .Values.lifecycleRelay.databaseUrlKey }}, path: database-url }
              - { key: {{ .Values.lifecycleRelay.databaseRoleKey }}, path: database-role }
              - { key: {{ .Values.lifecycleRelay.natsTokenKey }}, path: nats-token }
        - name: temp
          emptyDir: { sizeLimit: 32Mi }
{{- end }}
