{{- range $component := list "agents-ui" "session-gateway" "github-controller" "runtime" "model-proxy" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "codeops.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "codeops.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
---
{{- end }}
