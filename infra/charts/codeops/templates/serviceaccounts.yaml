{{- $components := list "agents-ui" "session-gateway" "runtime" "model-proxy" -}}
{{- if $.Values.plane.adapter.enabled -}}
{{- $components = append $components "github-controller" -}}
{{- end -}}
{{- if and (eq $.Values.temporal.driver "temporal") $.Values.plane.adapter.enabled -}}
{{- $components = append $components "orchestrator" -}}
{{- end -}}
{{- if eq $.Values.jetstream.driver "jetstream" -}}
{{- $components = append $components "lifecycle-relay" -}}
{{- end -}}
{{- range $component := $components }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "codeops.fullname" $ }}-{{ $component }}
  namespace: {{ ternary (include "codeops.executionNamespace" $) $.Release.Namespace (eq $component "runtime") }}
  labels:
    {{- include "codeops.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
---
{{- end }}
