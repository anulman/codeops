{{- $capabilities := list "acp" "checkpoint" "github-broker" "model-proxy" "work-items-broker" -}}
{{- $capabilityDigest := printf "sha256:%s" (($capabilities | toJson) | sha256sum) -}}
{{- $profile := dict "version" "codeops.runtime-profile/v1" "profileId" .Values.runtime.profileId "releaseDigest" (required "runtime release digest is required" .Values.runtime.releaseDigest) "capabilities" $capabilities "capabilityDigest" $capabilityDigest "resources" (dict "cpuMillis" 3000 "memoryMiB" 7168 "ephemeralStorageMiB" 5120) "authority" (dict "workspaceAccess" "bounded-writes" "publicNetwork" true "brokeredProviderEffects" true) "compatibilityPolicyRevision" .Values.runtime.compatibilityPolicyRevision "images" (dict "agent" (include "codeops.image" .Values.runtime.agentImage) "worker" (include "codeops.image" .Values.runtime.workerImage) "sessionGateway" (include "codeops.image" .Values.runtime.sessionGatewayImage)) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codeops.runtimeImagesConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
    codeops.dev/runtime-image-set: {{ include "codeops.runtimeImagesConfigMapName" . | quote }}
immutable: true
data:
  profile-registry.json: {{ dict "version" "codeops.runtime-profile-registry/v1" "profiles" (list $profile) | toJson | quote }}
  runtime-worker-image: {{ include "codeops.image" .Values.runtime.workerImage | quote }}
  coding-agent-image: {{ include "codeops.image" .Values.runtime.agentImage | quote }}
  session-gateway-image: {{ include "codeops.image" .Values.runtime.sessionGatewayImage | quote }}
  session-gateway-origin: http://{{ include "codeops.fullname" . }}-session-control-gateway:8080
  model-proxy-origin: http://{{ include "codeops.fullname" . }}-model-proxy:8080
  runtime-egress-proxy-origin: {{ ternary (printf "http://%s-runtime-egress-proxy:3128" (include "codeops.fullname" .)) "" .Values.runtimeEgressProxy.enabled | quote }}
