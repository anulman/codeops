  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ include "codeops.fullname" . }}-control-gateway }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: {{ include "codeops.fullname" . }}-github-controller }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 7233 }]
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{ end }}
