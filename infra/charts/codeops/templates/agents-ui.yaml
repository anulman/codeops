apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeops.fullname" . }}-agents-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents-ui
spec:
  replicas: {{ .Values.agentsUi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codeops.fullname" . }}-agents-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codeops.fullname" . }}-agents-ui
        app.kubernetes.io/component: agents-ui
        app.kubernetes.io/part-of: codeops
    spec:
      serviceAccountName: {{ include "codeops.fullname" . }}-agents-ui
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- include "codeops.imagePullSecrets" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agents-ui
          image: {{ include "codeops.image" .Values.agentsUi.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: production }
            - { name: CODEOPS_SESSION_BROKER_URL, value: http://{{ include "codeops.fullname" . }}-session-control-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080 }
            - { name: CODEOPS_SESSION_BROKER_READ_TOKEN_FILE, value: /var/run/secrets/codeops/read-token }
            - { name: CODEOPS_SESSION_BROKER_WRITE_TOKEN_FILE, value: /var/run/secrets/codeops/write-token }
            - { name: CODEOPS_WORKSPACE_LAUNCH_URL, value: http://{{ include "codeops.fullname" . }}-control-gateway.{{ .Release.Namespace }}.svc.cluster.local:8080 }
            - { name: CODEOPS_WORKSPACE_LAUNCH_TOKEN_FILE, value: /var/run/secrets/codeops-launch/workspace-launch-token }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.agentsUi.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: session-secrets, mountPath: /var/run/secrets/codeops, readOnly: true }
            - { name: workspace-launch-auth, mountPath: /var/run/secrets/codeops-launch, readOnly: true }
            - { name: temp, mountPath: /tmp }
      volumes:
        - name: session-secrets
          secret:
            secretName: {{ .Values.gateway.secretName }}
            defaultMode: 256
            items:
              - { key: read-token, path: read-token }
              - { key: write-token, path: write-token }
        - name: workspace-launch-auth
          secret:
            secretName: {{ .Values.controlGateway.secretName }}
            defaultMode: 256
            items:
              - { key: workspace-launch-token, path: workspace-launch-token }
        - name: temp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codeops.fullname" . }}-agents-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents-ui
spec:
  selector:
    app.kubernetes.io/name: {{ include "codeops.fullname" . }}-agents-ui
  ports:
    - { name: http, protocol: TCP, port: 3000, targetPort: http }
