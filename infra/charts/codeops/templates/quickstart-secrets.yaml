{{- if .Values.quickstart.enabled -}}
{{- $fullname := include "codeops.fullname" . -}}
{{- $postgresPassword := include "codeops.quickstart.stableSecret" (list . .Values.postgresql.secretName "password" 48) -}}
{{- $runtimePassword := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "runtime-database-password" 48) -}}
{{- $readToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "read-token" 48) -}}
{{- $writeToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "write-token" 48) -}}
{{- $runtimeWorkerToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "runtime-worker-token" 48) -}}
{{- $initializationToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "initialization-token" 48) -}}
{{- $signingKey := include "codeops.quickstart.stableSecret" (list . .Values.modelProxy.secretName "signing-key" 64) -}}
{{- $dispatchToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "dispatch-token" 48) -}}
{{- $repositoryHeadToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "repository-head-token" 48) -}}
{{- $publicationToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "publication-token" 48) -}}
{{- $researchProjectionToken := include "codeops.quickstart.stableSecret" (list . .Values.githubController.secretName "research-projection-token" 48) -}}
{{- $githubSteeringToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.repositorySteeringRegistrySecretName "github-steering-token" 48) -}}
{{- $databaseHost := printf "%s-postgresql" $fullname -}}
{{- $databaseUrl := printf "postgresql://agents:%s@%s:5432/agents" $postgresPassword $databaseHost -}}
{{- $runtimeRole := "codeops_runtime_receipts" -}}
{{- $runtimeDatabaseUrl := printf "postgresql://%s:%s@%s:5432/agents" $runtimeRole $runtimePassword $databaseHost -}}
{{- $registry := include "codeops.quickstart.registry" . -}}
{{- $registryAuth := printf "%s:%s" .Values.quickstart.registry.username .Values.quickstart.registry.token | b64enc -}}
{{- $dockerConfig := dict "auths" (dict .Values.quickstart.registry.server (dict "username" .Values.quickstart.registry.username "password" .Values.quickstart.registry.token "email" .Values.quickstart.registry.email "auth" $registryAuth)) | toJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  password: {{ $postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  database-url: {{ $databaseUrl | quote }}
  read-token: {{ $readToken | quote }}
  write-token: {{ $writeToken | quote }}
  runtime-worker-token: {{ $runtimeWorkerToken | quote }}
  initialization-token: {{ $initializationToken | quote }}
  runtime-database-url: {{ $runtimeDatabaseUrl | quote }}
  runtime-database-role: {{ $runtimeRole | quote }}
  runtime-database-password: {{ $runtimePassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.modelProxy.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  openai-api-key: {{ .Values.quickstart.openaiApiKey | quote }}
  signing-key: {{ $signingKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlGateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  dispatch-token: {{ $dispatchToken | quote }}
  repository-head-token: {{ $repositoryHeadToken | quote }}
  publication-token: {{ $publicationToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubController.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  research-projection-token: {{ $researchProjectionToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.agentsUi.access.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  audience: {{ .Values.quickstart.access.audience | quote }}
  allowed-emails: {{ join "\n" .Values.quickstart.access.allowedEmails | quote }}
{{ if .Values.quickstart.registry.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.quickstart.registry.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $dockerConfig | quote }}
{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlGateway.repositoryAuthoritySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  registry.json: {{ $registry | quote }}
  github-read-token: {{ .Values.quickstart.repository.github.readToken | quote }}
  github-write-token: {{ .Values.quickstart.repository.github.writeToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubController.repositoryAuthoritySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  registry.json: {{ $registry | quote }}
  github-webhook-secret: {{ .Values.quickstart.repository.github.webhookSecret | quote }}
  github-steering-token: {{ $githubSteeringToken | quote }}
  plane-api-key: {{ .Values.quickstart.repository.plane.apiKey | quote }}
  plane-webhook-secret: {{ .Values.quickstart.repository.plane.webhookSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.repositorySteeringRegistrySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  registry.json: {{ $registry | quote }}
  github-steering-token: {{ $githubSteeringToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-context" $fullname }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  AGENTS.md: {{ .Values.quickstart.repository.context.agents | quote }}
  CURRENT-STATE.md: {{ .Values.quickstart.repository.context.currentState | quote }}
  DECISIONS.md: {{ .Values.quickstart.repository.context.decisions | quote }}
  DOMAIN.md: {{ .Values.quickstart.repository.context.domain | quote }}
  PRODUCT.md: {{ .Values.quickstart.repository.context.product | quote }}
  SOURCE-MAP.md: {{ .Values.quickstart.repository.context.sourceMap | quote }}
  SOUL.md: {{ .Values.quickstart.repository.context.soul | quote }}
{{- end -}}
