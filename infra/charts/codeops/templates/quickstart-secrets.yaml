{{- if .Values.quickstart.enabled -}}
{{- $fullname := include "codeops.fullname" . -}}
{{- $postgresPassword := include "codeops.quickstart.stableSecret" (list . .Values.postgresql.secretName "password" 48) -}}
{{- $runtimePassword := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "runtime-database-password" 48) -}}
{{- $relayPassword := include "codeops.quickstart.stableSecret" (list . .Values.lifecycleRelay.secretName "database-password" 48) -}}
{{- $natsToken := include "codeops.quickstart.stableSecret" (list . .Values.lifecycleRelay.secretName "nats-token" 48) -}}
{{- $readToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "read-token" 48) -}}
{{- $writeToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "write-token" 48) -}}
{{- $runtimeWorkerToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "runtime-worker-token" 48) -}}
{{- $initializationToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.secretName "initialization-token" 48) -}}
{{- $signingKey := include "codeops.quickstart.stableSecret" (list . .Values.modelProxy.secretName "signing-key" 64) -}}
{{- $dispatchToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "dispatch-token" 48) -}}
{{- $repositoryHeadToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "repository-head-token" 48) -}}
{{- $publicationToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "publication-token" 48) -}}
{{- $workspaceLaunchToken := include "codeops.quickstart.stableSecret" (list . .Values.controlGateway.secretName "workspace-launch-token" 48) -}}
{{- $researchProjectionToken := include "codeops.quickstart.stableSecret" (list . .Values.githubController.secretName "research-projection-token" 48) -}}
{{- $githubSteeringToken := include "codeops.quickstart.stableSecret" (list . .Values.gateway.repositorySteeringRegistrySecretName "github-steering-token" 48) -}}
{{- $databaseHost := .Values.postgresql.serviceName -}}
{{- $databaseUrl := printf "postgresql://agents:%s@%s:5432/agents" $postgresPassword $databaseHost -}}
{{- $runtimeRole := "codeops_runtime_receipts" -}}
{{- $runtimeDatabaseUrl := printf "postgresql://%s:%s@%s:5432/agents" $runtimeRole $runtimePassword $databaseHost -}}
{{- $relayRole := "codeops_lifecycle_relay" -}}
{{- $relayDatabaseUrl := printf "postgresql://%s:%s@%s:5432/agents" $relayRole $relayPassword $databaseHost -}}
{{- $planePostgresPassword := include "codeops.quickstart.stableSecret" (list . "codeops-plane-postgres" "POSTGRES_PASSWORD" 48) -}}
{{- $planeRabbitPassword := include "codeops.quickstart.stableSecret" (list . "codeops-plane-rabbitmq" "RABBITMQ_DEFAULT_PASS" 48) -}}
{{- $planeMinioPassword := include "codeops.quickstart.stableSecret" (list . "codeops-plane-object-store" "MINIO_ROOT_PASSWORD" 48) -}}
{{- $planeSecretKey := include "codeops.quickstart.stableSecret" (list . "codeops-plane-app" "SECRET_KEY" 64) -}}
{{- $planeLiveSecretKey := include "codeops.quickstart.stableSecret" (list . "codeops-plane-live" "LIVE_SERVER_SECRET_KEY" 64) -}}
{{- $planePrefix := .Release.Name -}}
{{- $runtimeRegistry := include "codeops.quickstart.runtimeRegistry" . -}}
{{- $controllerRegistry := include "codeops.quickstart.controllerRegistry" . -}}
{{- $steeringRegistry := include "codeops.quickstart.steeringRegistry" . -}}
{{- $registryAuth := printf "%s:%s" .Values.quickstart.registry.username .Values.quickstart.registry.token | b64enc -}}
{{- $dockerConfig := dict "auths" (dict .Values.quickstart.registry.server (dict "username" .Values.quickstart.registry.username "password" .Values.quickstart.registry.token "email" .Values.quickstart.registry.email "auth" $registryAuth)) | toJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  password: {{ $postgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  database-url: {{ $databaseUrl | quote }}
  read-token: {{ $readToken | quote }}
  write-token: {{ $writeToken | quote }}
  runtime-worker-token: {{ $runtimeWorkerToken | quote }}
  initialization-token: {{ $initializationToken | quote }}
  runtime-database-url: {{ $runtimeDatabaseUrl | quote }}
  runtime-database-role: {{ $runtimeRole | quote }}
  runtime-database-password: {{ $runtimePassword | quote }}
{{- if eq .Values.jetstream.driver "jetstream" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.lifecycleRelay.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  database-url: {{ $relayDatabaseUrl | quote }}
  database-role: {{ $relayRole | quote }}
  database-password: {{ $relayPassword | quote }}
  nats-token: {{ $natsToken | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.modelProxy.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  openai-api-key: {{ .Values.quickstart.openaiApiKey | quote }}
  signing-key: {{ $signingKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlGateway.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  dispatch-token: {{ $dispatchToken | quote }}
  repository-head-token: {{ $repositoryHeadToken | quote }}
  publication-token: {{ $publicationToken | quote }}
  workspace-launch-token: {{ $workspaceLaunchToken | quote }}
{{- if .Values.plane.adapter.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubController.configSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  CODEOPS_TEMPORAL_ADDRESS: {{ .Values.temporal.address | quote }}
  CODEOPS_TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  CODEOPS_TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubController.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  research-projection-token: {{ $researchProjectionToken | quote }}
{{- end }}
{{ if .Values.quickstart.registry.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.quickstart.registry.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $dockerConfig | quote }}
{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.controlGateway.repositoryAuthoritySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  registry.json: {{ $runtimeRegistry | quote }}
  github-read-token: {{ .Values.quickstart.repository.github.readToken | quote }}
  github-write-token: {{ .Values.quickstart.repository.github.writeToken | quote }}
{{- if .Values.plane.adapter.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.githubController.repositoryAuthoritySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  registry.json: {{ $controllerRegistry | quote }}
  github-webhook-secret: {{ .Values.quickstart.repository.github.webhookSecret | quote }}
  github-steering-token: {{ $githubSteeringToken | quote }}
  plane-api-key: {{ .Values.quickstart.repository.plane.apiKey | quote }}
  plane-webhook-secret: {{ .Values.quickstart.repository.plane.webhookSecret | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gateway.repositorySteeringRegistrySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  registry.json: {{ $steeringRegistry | quote }}
  github-steering-token: {{ $githubSteeringToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-context" $fullname }}
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  AGENTS.md: {{ default (.Files.Get "files/project-context/AGENTS.md") .Values.quickstart.repository.context.agents | quote }}
  CURRENT-STATE.md: {{ .Values.quickstart.repository.context.currentState | quote }}
  DECISIONS.md: {{ .Values.quickstart.repository.context.decisions | quote }}
  DOMAIN.md: {{ .Values.quickstart.repository.context.domain | quote }}
  PRODUCT.md: {{ .Values.quickstart.repository.context.product | quote }}
  SOURCE-MAP.md: {{ .Values.quickstart.repository.context.sourceMap | quote }}
  SOUL.md: {{ default (.Files.Get "files/project-context/SOUL.md") .Values.quickstart.repository.context.soul | quote }}
{{- if and .Values.plane.enabled (eq .Values.plane.deployment "managed") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: codeops-plane-postgres
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  POSTGRES_USER: plane
  POSTGRES_DB: plane
  POSTGRES_PASSWORD: {{ $planePostgresPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: codeops-plane-rabbitmq
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: {{ $planeRabbitPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: codeops-plane-object-store
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  USE_MINIO: "1"
  MINIO_ROOT_USER: plane
  MINIO_ROOT_PASSWORD: {{ $planeMinioPassword | quote }}
  AWS_ACCESS_KEY_ID: plane
  AWS_SECRET_ACCESS_KEY: {{ $planeMinioPassword | quote }}
  AWS_S3_BUCKET_NAME: uploads
  AWS_S3_ENDPOINT_URL: {{ printf "http://%s-minio:9000" $planePrefix | quote }}
  AWS_REGION: ""
  FILE_SIZE_LIMIT: "5242880"
---
apiVersion: v1
kind: Secret
metadata:
  name: codeops-plane-app
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  SECRET_KEY: {{ $planeSecretKey | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/" $planePrefix | quote }}
  DATABASE_URL: {{ printf "postgresql://plane:%s@%s-pgdb:5432/plane" $planePostgresPassword $planePrefix | quote }}
  AMQP_URL: {{ printf "amqp://plane:%s@%s-rabbitmq:5672/" $planeRabbitPassword $planePrefix | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: codeops-plane-live
  namespace: {{ .Release.Namespace }}
  annotations: { helm.sh/resource-policy: keep }
  labels: { app.kubernetes.io/part-of: codeops }
type: Opaque
stringData:
  REDIS_URL: {{ printf "redis://%s-redis:6379/" $planePrefix | quote }}
  LIVE_SERVER_SECRET_KEY: {{ $planeLiveSecretKey | quote }}
{{- end }}
{{- end -}}
