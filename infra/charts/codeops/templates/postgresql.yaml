apiVersion: v1
kind: Service
metadata:
  name: {{ include "codeops.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "codeops.fullname" . }}-postgresql
  ports:
    - { name: postgresql, protocol: TCP, port: 5432, targetPort: postgresql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "codeops.fullname" . }}-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "codeops.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "codeops.fullname" . }}-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codeops.fullname" . }}-postgresql
        app.kubernetes.io/component: postgresql
        app.kubernetes.io/part-of: codeops
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgresql
          image: {{ include "codeops.image" .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_DB, value: agents }
            - { name: POSTGRES_USER, value: agents }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgresql.secretName }}, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgresql, containerPort: 5432 }
          startupProbe:
            exec: { command: ["pg_isready", "-U", "agents", "-d", "agents"] }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "agents", "-d", "agents"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "agents", "-d", "agents"] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: temp, mountPath: /tmp }
      volumes:
        - name: temp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: {{ include "codeops.fullname" . }}-postgresql
          app.kubernetes.io/part-of: codeops
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgresql.storage }} }
