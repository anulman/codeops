{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "codeops.fullname" . }}-session-migration
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-13"
automountServiceAccountToken: false
---
{{- if .Release.IsUpgrade }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "codeops.fullname" . }}-session-migration-quiesce
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-12"
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [{{ printf "%s-session-gateway" (include "codeops.fullname" .) | quote }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "codeops.fullname" . }}-session-migration-quiesce
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-11"
subjects:
  - kind: ServiceAccount
    name: {{ include "codeops.fullname" . }}-session-migration
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "codeops.fullname" . }}-session-migration-quiesce
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "codeops.fullname" . }}-session-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codeops.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-migration
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
  {{- end }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "codeops.fullname" . }}-session-migrate
        app.kubernetes.io/component: session-migration
        app.kubernetes.io/part-of: codeops
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "codeops.fullname" . }}-session-migration
      automountServiceAccountToken: {{ .Release.IsUpgrade }}
      enableServiceLinks: false
      imagePullSecrets:
        {{- include "codeops.imagePullSecrets" . | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-postgresql
          image: {{ include "codeops.image" .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - until pg_isready -h {{ ternary .Values.postgresql.serviceName .Values.postgresql.external.host (eq .Values.postgresql.deployment "managed") }} -p {{ ternary 5432 .Values.postgresql.external.port (eq .Values.postgresql.deployment "managed") }} -U agents; do sleep 2; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: migrate
          image: {{ include "codeops.image" .Values.gateway.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, services/codeops-control-gateway/dist/session-migrate-main.js]
          env:
            {{- if .Release.IsUpgrade }}
            - { name: CODEOPS_MIGRATION_QUIESCE_WRITERS, value: "true" }
            - { name: CODEOPS_NAMESPACE, value: {{ .Release.Namespace | quote }} }
            - name: CODEOPS_MIGRATION_WRITER_DEPLOYMENTS
              value: {{ list (printf "%s-session-gateway" (include "codeops.fullname" .)) | toJson | quote }}
            {{- end }}
            - { name: CODEOPS_DATABASE_URL_FILE, value: /var/run/secrets/codeops-migration/database-url }
            - { name: CODEOPS_APPLICATION_DATABASE_URL_FILE, value: /var/run/secrets/codeops-application/database-url }
            {{- with .Values.sessionOwner.legacyPrincipalId }}
            - { name: CODEOPS_LEGACY_SESSION_OWNER_PRINCIPAL_ID, value: {{ . | quote }} }
            {{- end }}
            - { name: CODEOPS_RUNTIME_DATABASE_URL_FILE, value: /var/run/secrets/codeops/runtime-database-url }
            - { name: CODEOPS_RUNTIME_DATABASE_ROLE_FILE, value: /var/run/secrets/codeops/runtime-database-role }
            - { name: CODEOPS_MODEL_PROXY_DATABASE_URL_FILE, value: /var/run/secrets/codeops-model-proxy/database-url }
            - { name: CODEOPS_MODEL_PROXY_DATABASE_ROLE_FILE, value: /var/run/secrets/codeops-model-proxy/database-role }
            {{- if eq .Values.jetstream.driver "jetstream" }}
            - { name: CODEOPS_LIFECYCLE_RELAY_DATABASE_URL_FILE, value: /var/run/secrets/codeops-relay/database-url }
            - { name: CODEOPS_LIFECYCLE_RELAY_DATABASE_ROLE_FILE, value: /var/run/secrets/codeops-relay/database-role }
            {{- end }}
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: migration-authority, mountPath: /var/run/secrets/codeops-migration, readOnly: true }
            - { name: application-authority, mountPath: /var/run/secrets/codeops-application, readOnly: true }
            - { name: secrets, mountPath: /var/run/secrets/codeops, readOnly: true }
            - { name: model-proxy-authority, mountPath: /var/run/secrets/codeops-model-proxy, readOnly: true }
            {{- if eq .Values.jetstream.driver "jetstream" }}
            - { name: relay-authority, mountPath: /var/run/secrets/codeops-relay, readOnly: true }
            {{- end }}
            - { name: temp, mountPath: /tmp }
      volumes:
        - name: migration-authority
          secret:
            secretName: {{ .Values.migration.secretName }}
            defaultMode: 256
            items:
              - { key: database-url, path: database-url }
        - name: application-authority
          secret:
            secretName: {{ .Values.migration.applicationSecretName }}
            defaultMode: 256
            items:
              - { key: database-url, path: database-url }
        - name: secrets
          secret:
            secretName: {{ .Values.gateway.secretName }}
            defaultMode: 256
            items:
              - { key: runtime-database-url, path: runtime-database-url }
              - { key: runtime-database-role, path: runtime-database-role }
        {{- if eq .Values.jetstream.driver "jetstream" }}
        - name: relay-authority
          secret:
            secretName: {{ .Values.lifecycleRelay.secretName }}
            defaultMode: 256
            items:
              - { key: {{ .Values.lifecycleRelay.databaseUrlKey }}, path: database-url }
              - { key: {{ .Values.lifecycleRelay.databaseRoleKey }}, path: database-role }
        {{- end }}
        - name: model-proxy-authority
          secret:
            secretName: {{ .Values.modelProxy.secretName }}
            defaultMode: 256
            items:
              - { key: {{ .Values.modelProxy.databaseUrlKey }}, path: database-url }
              - { key: {{ .Values.modelProxy.databaseRoleKey }}, path: database-role }
        - name: temp
          emptyDir: { sizeLimit: 32Mi }
{{- end }}
