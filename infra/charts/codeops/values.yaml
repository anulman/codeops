nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

nodeSelector: {}

agentsUi:
  replicas: 1
  image:
    repository: ghcr.io/anulman/codeops/agents-ui
    digest: ""
  access:
    issuer: ""
    secretName: codeops-access
    audienceKey: audience
    allowedEmailsKey: allowed-emails
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

gateway:
  replicas: 1
  image:
    repository: ghcr.io/anulman/codeops/session-control-gateway
    digest: ""
  secretName: codeops-session-secrets
  repositorySteeringRegistrySecretName: codeops-repository-steering
  workerId: codeops:runtime-worker
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

modelProxy:
  replicas: 1
  image:
    repository: ghcr.io/anulman/codeops/model-proxy
    digest: ""
  secretName: codeops-model-proxy-credentials
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

migration:
  enabled: true

githubController:
  replicas: 1
  image:
    repository: ghcr.io/anulman/codeops/plane-controller
    digest: ""
  controlPlaneSha: ""
  configSecretName: codeops-controller-config
  secretName: codeops-controller-secrets
  repositoryAuthoritySecretName: codeops-repository-controller-authority
  storageClassName: ""
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

postgresql:
  image:
    repository: postgres
    digest: ""
  secretName: codeops-postgres
  storageClassName: ""
  storage: 20Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

runtime:
  workerImage:
    repository: ghcr.io/anulman/codeops/session-runtime-worker
    digest: ""
  agentImage:
    repository: ghcr.io/anulman/codeops/agent
    digest: ""

ingress:
  className: nginx
  host: codeops.example.com
  tlsSecretName: codeops-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    nginx.ingress.kubernetes.io/proxy-body-size: 2m

networkPolicy:
  ingressNamespace: ingress-nginx
