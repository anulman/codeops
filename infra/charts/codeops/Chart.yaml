apiVersion: v2
name: codeops
description: Multi-repository control plane for durable coding-agent sessions
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/anulman/codeops
sources:
  - https://github.com/anulman/codeops
annotations:
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: nats
    alias: jetstream
    version: 2.14.0
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: jetstream.enabled
  - name: temporal
    version: 1.6.0
    repository: https://go.temporal.io/helm-charts/
    condition: temporal.enabled
  - name: plane-ce
    alias: plane
    version: 1.6.2
    repository: https://helm.plane.so/
    condition: plane.enabled
