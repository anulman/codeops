apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-system-controller-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-controller
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.githubController.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.githubController.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-system-github-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-controller
spec:
  replicas: {{ .Values.githubController.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: agents-system-github-controller }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-system-github-controller
        app.kubernetes.io/component: github-controller
        app.kubernetes.io/part-of: agents-system
    spec:
      serviceAccountName: agents-system-github-controller
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: github-controller
          image: {{ include "agents-system.image" .Values.githubController.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: {{ .Values.githubController.configSecretName }} }
          env:
            - { name: CODEOPS_HTTP_HOST, value: 0.0.0.0 }
            - { name: CODEOPS_HTTP_PORT, value: "8080" }
            - { name: CODEOPS_CONTROL_PLANE_SHA, value: {{ .Values.githubController.controlPlaneSha | quote }} }
            - { name: CODEOPS_DEDUP_ROOT, value: /var/lib/agents-system/controller }
            - { name: CODEOPS_GITHUB_SESSION_STEERING_ORIGIN, value: http://agents-session-control-gateway:8080 }
            - { name: CODEOPS_PLANE_API_KEY_FILE, value: /var/run/secrets/agents-system-controller/plane-api-key }
            - { name: CODEOPS_PLANE_WEBHOOK_SECRET_FILE, value: /var/run/secrets/agents-system-controller/plane-webhook-secret }
            - { name: CODEOPS_RESEARCH_PROJECTION_TOKEN_FILE, value: /var/run/secrets/agents-system-controller/research-projection-token }
            - { name: CODEOPS_REPOSITORY_HEAD_TOKEN_FILE, value: /var/run/secrets/agents-system-controller/repository-head-token }
            - { name: CODEOPS_GITHUB_WEBHOOK_SECRET_FILE, value: /var/run/secrets/agents-system-controller/github-webhook-secret }
            - { name: CODEOPS_GITHUB_SESSION_STEERING_TOKEN_FILE, value: /var/run/secrets/agents-system-controller/github-steering-token }
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.githubController.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: controller-state, mountPath: /var/lib/agents-system/controller }
            - { name: controller-secrets, mountPath: /var/run/secrets/agents-system-controller, readOnly: true }
            - { name: temp, mountPath: /tmp }
      volumes:
        - { name: controller-state, persistentVolumeClaim: { claimName: agents-system-controller-state } }
        - name: controller-secrets
          secret:
            secretName: {{ .Values.githubController.secretName }}
            defaultMode: 256
            items:
              - { key: plane-api-key, path: plane-api-key }
              - { key: plane-webhook-secret, path: plane-webhook-secret }
              - { key: research-projection-token, path: research-projection-token }
              - { key: repository-head-token, path: repository-head-token }
              - { key: github-webhook-secret, path: github-webhook-secret }
              - { key: github-steering-token, path: github-steering-token }
        - name: temp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agents-system-github-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-controller
spec:
  selector: { app.kubernetes.io/name: agents-system-github-controller }
  ports:
    - { name: http, protocol: TCP, port: 8080, targetPort: http }
