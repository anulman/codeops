apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-system-mission-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: mission-control
spec:
  replicas: {{ .Values.missionControl.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agents-system-mission-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-system-mission-control
        app.kubernetes.io/component: mission-control
        app.kubernetes.io/part-of: agents-system
    spec:
      serviceAccountName: agents-system-mission-control
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mission-control
          image: {{ include "agents-system.image" .Values.missionControl.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOST, value: 0.0.0.0 }
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: production }
            - { name: AGENTS_UI_ACCESS_REQUIRED, value: "true" }
            - { name: AGENTS_UI_ACCESS_ISSUER, value: {{ .Values.missionControl.access.issuer | trimSuffix "/" | quote }} }
            - name: AGENTS_UI_ACCESS_AUDIENCE
              valueFrom:
                secretKeyRef: { name: {{ .Values.missionControl.access.secretName }}, key: {{ .Values.missionControl.access.audienceKey }} }
            - { name: AGENTS_UI_ACCESS_ALLOWED_EMAILS_FILE, value: /var/run/secrets/agents-system-access/allowed-emails }
            - { name: CODEOPS_SESSION_BROKER_URL, value: http://agents-session-control-gateway:8080 }
            - { name: CODEOPS_SESSION_BROKER_READ_TOKEN_FILE, value: /var/run/secrets/agents-system/read-token }
            - { name: CODEOPS_SESSION_BROKER_WRITE_TOKEN_FILE, value: /var/run/secrets/agents-system/write-token }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.missionControl.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: session-secrets, mountPath: /var/run/secrets/agents-system, readOnly: true }
            - { name: access-identity, mountPath: /var/run/secrets/agents-system-access, readOnly: true }
            - { name: temp, mountPath: /tmp }
      volumes:
        - name: session-secrets
          secret:
            secretName: {{ .Values.gateway.secretName }}
            defaultMode: 256
            items:
              - { key: read-token, path: read-token }
              - { key: write-token, path: write-token }
        - name: access-identity
          secret:
            secretName: {{ .Values.missionControl.access.secretName }}
            defaultMode: 256
            items:
              - { key: {{ .Values.missionControl.access.allowedEmailsKey }}, path: allowed-emails }
        - name: temp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agents-system-mission-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: mission-control
spec:
  selector:
    app.kubernetes.io/name: agents-system-mission-control
  ports:
    - { name: http, protocol: TCP, port: 3000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agents-system-mission-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: mission-control
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: agents-system-github-controller
                port: { name: http }
          - path: /webhooks/plane
            pathType: Exact
            backend:
              service:
                name: agents-system-github-controller
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agents-system-mission-control
                port: { name: http }
