apiVersion: v1
kind: ConfigMap
metadata:
  name: agents-system-runtime-images
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
immutable: true
data:
  runtime-worker-image: {{ include "agents-system.image" .Values.runtime.workerImage | quote }}
  coding-agent-image: {{ include "agents-system.image" .Values.runtime.agentImage | quote }}
  session-gateway-origin: http://agents-session-control-gateway:8080
  model-proxy-origin: http://agents-system-model-proxy:8080
