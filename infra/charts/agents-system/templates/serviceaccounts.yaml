{{- range $component := list "mission-control" "session-gateway" "github-controller" "runtime" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-system-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agents-system.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
---
{{- end }}
