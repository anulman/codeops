apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codeops-codex-auth
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-cinder-high-speed
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-codex-auth
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: codeops-codex-auth-__CODEOPS_AUTH_ACTION__
  labels:
    app.kubernetes.io/name: codeops-codex-auth
    app.kubernetes.io/part-of: codeops-trial0
    codeops.example/auth-action: __CODEOPS_AUTH_ACTION__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-codex-auth
        app.kubernetes.io/part-of: codeops-trial0
        codeops.example/auth-action: __CODEOPS_AUTH_ACTION__
    spec:
      restartPolicy: Never
      serviceAccountName: codeops-codex-auth
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: codeops-registry
      nodeSelector:
        codeops.example/codeops: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: codex-auth
          image: ghcr.io/anulman/codeops/agent@__CODEOPS_AGENT_DIGEST__
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ceu]
          args:
            - |
              umask 077
              mkdir -p "$CODEX_HOME"
              printf '%s\n' \
                'cli_auth_credentials_store = "file"' \
                'forced_login_method = "chatgpt"' \
                > "$CODEX_HOME/config.toml"
              case "__CODEOPS_AUTH_ACTION__" in
                login)
                  exec /opt/codeops-agent/node_modules/.bin/codex login --device-auth
                  ;;
                smoke)
                  /opt/codeops-agent/node_modules/.bin/codex login status
                  ;;
                *)
                  exit 64
                  ;;
              esac
          env:
            - name: CODEX_HOME
              value: /var/lib/codeops-codex
            - name: CODEX_SQLITE_HOME
              value: /tmp/codex-state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: codex-auth
              mountPath: /var/lib/codeops-codex
            - name: temp
              mountPath: /tmp
      volumes:
        - name: codex-auth
          persistentVolumeClaim:
            claimName: codeops-codex-auth
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-codex-auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codeops-codex-auth
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - { protocol: TCP, port: 443 }
