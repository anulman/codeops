apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-control-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeops-control-gateway
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: codeops-control-gateway }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-control-gateway
        app.kubernetes.io/part-of: codeops-session-proof
    spec:
      serviceAccountName: codeops-control-gateway
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{ name: codeops-registry }]
      nodeSelector: { codeops.example/codeops: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/anulman/codeops/session-control-gateway@__CODEOPS_SESSION_CONTROL_GATEWAY_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - { name: CODEOPS_DATABASE_URL_FILE, value: /var/run/secrets/codeops-session-broker/database-url }
            - { name: CODEOPS_SESSION_BROKER_READ_TOKEN_FILE, value: /var/run/secrets/codeops-session-read/token }
            - { name: CODEOPS_SESSION_BROKER_WRITE_TOKEN_FILE, value: /var/run/secrets/codeops-session-write/token }
            - { name: CODEOPS_SESSION_RUNTIME_WORKER_TOKEN_FILE, value: /var/run/secrets/codeops-session-runtime-worker/token }
            - { name: CODEOPS_SESSION_JOB_INITIALIZATION_TOKEN_FILE, value: /var/run/secrets/codeops-session-job-initialization/token }
            - { name: CODEOPS_SESSION_RUNTIME_WORKER_ID, value: acp-worker:video-proof }
            - { name: CODEOPS_HTTP_HOST, value: 0.0.0.0 }
            - { name: CODEOPS_HTTP_PORT, value: "8080" }
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: database, mountPath: /var/run/secrets/codeops-session-broker, readOnly: true }
            - { name: read-auth, mountPath: /var/run/secrets/codeops-session-read, readOnly: true }
            - { name: write-auth, mountPath: /var/run/secrets/codeops-session-write, readOnly: true }
            - { name: worker-auth, mountPath: /var/run/secrets/codeops-session-runtime-worker, readOnly: true }
            - { name: initialization-auth, mountPath: /var/run/secrets/codeops-session-job-initialization, readOnly: true }
            - { name: temp, mountPath: /tmp }
      volumes:
        - name: database
          secret: { secretName: codeops-session-broker-database, defaultMode: 256, items: [{ key: database-url, path: database-url }] }
        - name: read-auth
          secret: { secretName: codeops-session-broker-read-auth, defaultMode: 256, items: [{ key: token, path: token }] }
        - name: write-auth
          secret: { secretName: codeops-session-broker-write-auth, defaultMode: 256, items: [{ key: token, path: token }] }
        - name: worker-auth
          secret: { secretName: codeops-session-runtime-worker-auth, defaultMode: 256, items: [{ key: token, path: token }] }
        - name: initialization-auth
          secret: { secretName: codeops-session-job-initialization-auth, defaultMode: 256, items: [{ key: token, path: token }] }
        - { name: temp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: codeops-control-gateway
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: codeops-control-gateway }
  ports: [{ name: http, protocol: TCP, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-control-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: codeops-control-gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: codeops-agents-ui } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: codeops-session-runtime-worker } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: codeops-session-proof-database } }
      ports: [{ protocol: TCP, port: 5432 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
