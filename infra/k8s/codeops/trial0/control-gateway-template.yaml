apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-control-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codeops-control-gateway
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codeops-control-gateway
subjects:
  - kind: ServiceAccount
    name: codeops-control-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codeops-control-gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codeops-control-gateway-evidence
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-cinder-high-speed
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeops-control-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codeops-control-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-control-gateway
        app.kubernetes.io/part-of: codeops-trial0
    spec:
      serviceAccountName: codeops-control-gateway
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-renoconcierge
      nodeSelector:
        renoconcierge.ca/codeops: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/anulman/renoconcierge/renoconcierge-codeops-control-gateway@__CODEOPS_CONTROL_GATEWAY_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEOPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CODEOPS_REPOSITORY_URL
              value: https://github.com/anulman/renoconcierge
            - name: CODEOPS_AGENT_IMAGE
              value: ghcr.io/anulman/renoconcierge/renoconcierge-codeops-agent@__CODEOPS_AGENT_DIGEST__
            - name: CODEOPS_SESSION_GATEWAY_IMAGE
              value: ghcr.io/anulman/renoconcierge/renoconcierge-codeops-session-gateway@__CODEOPS_SESSION_GATEWAY_DIGEST__
            - name: CODEOPS_DISPATCH_TOKEN_FILE
              value: /var/run/secrets/codeops-dispatch/token
            - name: CODEOPS_REPOSITORY_READ_TOKEN_FILE
              value: /var/run/secrets/codeops-runtime/repository-read-token
            - name: CODEOPS_MODEL_API_KEY_FILE
              value: /var/run/secrets/codeops-runtime/model-api-key
            - name: CODEOPS_EVIDENCE_ROOT
              value: /var/lib/codeops
            - name: CODEOPS_HTTP_HOST
              value: 0.0.0.0
            - name: CODEOPS_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/codeops
            - name: dispatch-auth
              mountPath: /var/run/secrets/codeops-dispatch
              readOnly: true
            - name: runtime-credentials
              mountPath: /var/run/secrets/codeops-runtime
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: codeops-control-gateway-evidence
        - name: dispatch-auth
          secret:
            secretName: codeops-agent-dispatch-auth
            defaultMode: 256
            items:
              - key: token
                path: token
        - name: runtime-credentials
          secret:
            secretName: codeops-agent-source-credentials
            defaultMode: 256
            items:
              - key: repository-read-token
                path: repository-read-token
              - key: model-api-key
                path: model-api-key
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: codeops-control-gateway
spec:
  selector:
    app.kubernetes.io/name: codeops-control-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-control-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codeops-control-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-orchestrator
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - ipBlock:
            cidr: __CODEOPS_KUBERNETES_API_CIDR__
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
