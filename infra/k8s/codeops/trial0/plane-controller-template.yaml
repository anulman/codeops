apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-plane-controller
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codeops-plane-controller-ledger
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cinder-high-speed
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeops-plane-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codeops-plane-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-plane-controller
        app.kubernetes.io/part-of: codeops-trial0
    spec:
      serviceAccountName: codeops-plane-controller
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: codeops-registry
      nodeSelector:
        codeops.example/codeops: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/anulman/codeops/plane-controller@__CODEOPS_PLANE_CONTROLLER_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEOPS_TEMPORAL_ADDRESS
              value: codeops-temporal:7233
            - name: CODEOPS_TEMPORAL_NAMESPACE
              value: codeops
            - name: CODEOPS_TEMPORAL_TASK_QUEUE
              value: codeops-trial0
            - name: CODEOPS_PLANE_API_ORIGIN
              value: https://work.codeops.example
            - name: CODEOPS_PLANE_WORKSPACE_SLUG
              value: __CODEOPS_PLANE_WORKSPACE_SLUG__
            - name: CODEOPS_PLANE_API_KEY_FILE
              value: /var/run/secrets/codeops/plane-api-key
            - name: CODEOPS_PLANE_WEBHOOK_SECRET_FILE
              value: /var/run/secrets/codeops/webhook-secret
            - name: CODEOPS_GITHUB_WEBHOOK_SECRET_FILE
              value: /var/run/secrets/codeops/github-webhook-secret
            - name: CODEOPS_RESEARCH_PROJECTION_TOKEN_FILE
              value: /var/run/codeops-projection/token
            - name: CODEOPS_REPOSITORY_HEAD_ORIGIN
              value: http://codeops-control-gateway:8080
            - name: CODEOPS_REPOSITORY_HEAD_TOKEN_FILE
              value: /var/run/codeops-repository-head/token
            - name: CODEOPS_ALLOWED_HUMAN_ACTOR_IDS
              value: __CODEOPS_ALLOWED_HUMAN_ACTOR_IDS__
            - name: CODEOPS_ALLOWED_GITHUB_REVIEWER_IDS
              value: "__CODEOPS_ALLOWED_GITHUB_REVIEWER_IDS__"
            - name: CODEOPS_READY_STATE_ID
              value: __CODEOPS_READY_STATE_ID__
            - name: CODEOPS_IN_PROGRESS_STATE_ID
              value: __CODEOPS_IN_PROGRESS_STATE_ID__
            - name: CODEOPS_NEEDS_ATTENTION_STATE_ID
              value: __CODEOPS_NEEDS_ATTENTION_STATE_ID__
            - name: CODEOPS_COMPLETE_STATE_ID
              value: __CODEOPS_COMPLETE_STATE_ID__
            - name: CODEOPS_PERSONA_USER_IDS
              value: __CODEOPS_PERSONA_USER_IDS__
            - name: CODEOPS_REPOSITORY_OWNER
              value: anulman
            - name: CODEOPS_REPOSITORY_NAME
              value: example-repository
            - name: CODEOPS_CONTROL_PLANE_SHA
              value: __CODEOPS_CONTROL_PLANE_SHA__
            - name: CODEOPS_DEDUP_ROOT
              value: /var/lib/codeops/dedup
            - name: CODEOPS_HTTP_HOST
              value: 0.0.0.0
            - name: CODEOPS_HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ledger
              mountPath: /var/lib/codeops
            - name: controller-secrets
              mountPath: /var/run/secrets/codeops
              readOnly: true
            - name: projection-auth
              mountPath: /var/run/codeops-projection
              readOnly: true
            - name: repository-head-auth
              mountPath: /var/run/codeops-repository-head
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: codeops-plane-controller-ledger
        - name: controller-secrets
          secret:
            secretName: codeops-plane-controller-secrets
            defaultMode: 288
            items:
              - key: plane-api-key
                path: plane-api-key
              - key: webhook-secret
                path: webhook-secret
              - key: github-webhook-secret
                path: github-webhook-secret
        - name: projection-auth
          secret:
            secretName: codeops-research-projection-auth
            defaultMode: 256
        - name: repository-head-auth
          secret:
            secretName: codeops-repository-head-auth
            defaultMode: 256
        - name: temp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: codeops-plane-controller
spec:
  selector:
    app.kubernetes.io/name: codeops-plane-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeops-plane-controller
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __CODEOPS_PLANE_CONTROLLER_HOST__
      secretName: codeops-plane-work-tls
  rules:
    - host: __CODEOPS_PLANE_CONTROLLER_HOST__
      http:
        paths:
          - path: /webhooks/plane
            pathType: Exact
            backend:
              service:
                name: codeops-plane-controller
                port:
                  name: http
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: codeops-plane-controller
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-plane-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codeops-plane-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-orchestrator
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-control-gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
