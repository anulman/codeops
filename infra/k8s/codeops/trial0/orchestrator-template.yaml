apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-orchestrator
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeops-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codeops-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-orchestrator
        app.kubernetes.io/part-of: codeops-trial0
    spec:
      serviceAccountName: codeops-orchestrator
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-renoconcierge
      nodeSelector:
        renoconcierge.ca/codeops: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: ghcr.io/anulman/renoconcierge/renoconcierge-codeops-orchestrator@CODEOPS_ORCHESTRATOR_DIGEST
          imagePullPolicy: IfNotPresent
          env:
            - name: CODEOPS_TEMPORAL_ADDRESS
              value: codeops-temporal:7233
            - name: CODEOPS_TEMPORAL_NAMESPACE
              value: codeops
            - name: CODEOPS_TEMPORAL_TASK_QUEUE
              value: codeops-trial0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-orchestrator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codeops-orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-temporal
      ports:
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
