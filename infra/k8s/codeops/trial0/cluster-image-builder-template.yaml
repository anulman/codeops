apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-image-builder-__CODEOPS_BUILD_SUFFIX__
  labels:
    codeops.example/build-id: __CODEOPS_BUILD_ID__
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: codeops-image-builder-__CODEOPS_BUILD_SUFFIX__
  labels:
    app.kubernetes.io/name: codeops-image-builder
    codeops.example/build-id: __CODEOPS_BUILD_ID__
    codeops.example/image-name: __CODEOPS_IMAGE_KIND__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-image-builder
        app.kubernetes.io/part-of: codeops-trial0
        codeops.example/build-id: __CODEOPS_BUILD_ID__
        codeops.example/image-name: __CODEOPS_IMAGE_KIND__
    spec:
      serviceAccountName: codeops-image-builder-__CODEOPS_BUILD_SUFFIX__
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      imagePullSecrets:
        - name: codeops-registry-pull
      nodeSelector:
        codeops.example/codeops: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: source
          image: docker.io/alpine/git@sha256:53a6239398162098fed2f49a46512f9cbba9e3f31b9f2cea4fa90129ee069a99
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
            - |
              umask 077
              cat > /tmp/git-askpass <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s\n' x-access-token ;;
                *Password*) printf '%s\n' "$CODEOPS_REPOSITORY_READ_TOKEN" ;;
                *) exit 1 ;;
              esac
              EOF
              chmod 700 /tmp/git-askpass
              GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
                git clone --filter=blob:none --no-checkout \
                  https://github.com/example-org/example-repository.git /workspace
              cd /workspace
              GIT_ASKPASS=/tmp/git-askpass GIT_TERMINAL_PROMPT=0 \
                git fetch --depth=1 origin "$CODEOPS_BASE_SHA"
              git checkout --detach "$CODEOPS_BASE_SHA"
              test "$(git rev-parse HEAD)" = "$CODEOPS_BASE_SHA"
              git remote remove origin
              rm -f /tmp/git-askpass
          env:
            - name: CODEOPS_BASE_SHA
              value: __CODEOPS_BASE_SHA__
            - name: CODEOPS_REPOSITORY_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codeops-build-__CODEOPS_BUILD_SUFFIX__
                  key: repository-read-token
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: temp
              mountPath: /tmp
      containers:
        - name: builder
          image: docker.io/moby/buildkit@sha256:d947144c3dc4f827f8dacaaf98d622f0143465740075fa9790991bc381761dc9
          imagePullPolicy: IfNotPresent
          command:
            - buildctl-daemonless.sh
          args:
            - build
            - --frontend
            - dockerfile.v0
            - --local
            - context=/workspace
            - --local
            - dockerfile=/workspace/__CODEOPS_DOCKERFILE_DIRECTORY__
            - --opt
            - filename=__CODEOPS_DOCKERFILE_NAME__
            - --opt
            - platform=linux/amd64
__CODEOPS_TARGET_ARGS__
            - --output
            - type=image,name=codeops-registry:5000/__CODEOPS_IMAGE_REPOSITORY__:candidate-__CODEOPS_BASE_SHA__,push=true,registry.insecure=true
          env:
            - name: BUILDKITD_FLAGS
              value: --oci-worker-no-process-sandbox
            - name: DOCKER_CONFIG
              value: /var/run/secrets/registry
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
            - name: buildkit
              mountPath: /home/user/.local/share/buildkit
            - name: registry-auth
              mountPath: /var/run/secrets/registry
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: buildkit
          emptyDir:
            sizeLimit: 8Gi
        - name: registry-auth
          secret:
            secretName: codeops-registry-push
            defaultMode: 288
            items:
              - key: config.json
                path: config.json
        - name: temp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-image-builder-__CODEOPS_BUILD_SUFFIX__
  labels:
    codeops.example/build-id: __CODEOPS_BUILD_ID__
spec:
  podSelector:
    matchLabels:
      codeops.example/build-id: __CODEOPS_BUILD_ID__
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-registry
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
