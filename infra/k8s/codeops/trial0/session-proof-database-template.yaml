apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-session-proof-database
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codeops-session-proof-database-init
data:
  01-runtime-worker.sh: |
    #!/bin/sh
    set -eu
    worker_password="$(cat /var/run/secrets/codeops-session-runtime-database/password)"
    psql --set=ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=worker_password="$worker_password" <<'SQL'
    CREATE ROLE codeops_session_runtime_worker
      LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION
      PASSWORD :'worker_password';
    SQL
    unset worker_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeops-session-proof-database
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: codeops-session-proof-database }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-session-proof-database
        app.kubernetes.io/part-of: codeops-session-proof
    spec:
      serviceAccountName: codeops-session-proof-database
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{ name: ghcr-renoconcierge }]
      nodeSelector: { renoconcierge.ca/codeops: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 102
        fsGroup: 102
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: ghcr.io/anulman/renoconcierge/renoconcierge-postgres@__CODEOPS_SESSION_PROOF_POSTGRES_DIGEST__
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ceu, --]
          args:
            - |
              owner_user="$(cat "$POSTGRES_USER_FILE")"
              owner_password="$(cat "$POSTGRES_PASSWORD_FILE")"
              owner_database="$(cat "$POSTGRES_DB_FILE")"
              password_file="$(mktemp /tmp/codeops-postgres-password.XXXXXX)"
              trap 'rm -f "$password_file"' EXIT HUP INT TERM
              printf '%s' "$owner_password" > "$password_file"
              unset owner_password

              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                mkdir -p "$PGDATA"
                chmod 0700 "$PGDATA"
                initdb \
                  --pgdata="$PGDATA" \
                  --username="$owner_user" \
                  --pwfile="$password_file" \
                  --auth-host=scram-sha-256 \
                  --auth-local=trust
                pg_ctl \
                  --pgdata="$PGDATA" \
                  --options="-c listen_addresses='' -c unix_socket_directories=/var/run/postgresql" \
                  --wait start
                createdb --host=/var/run/postgresql --username="$owner_user" "$owner_database"
                export POSTGRES_USER="$owner_user" POSTGRES_DB="$owner_database"
                for init_file in /docker-entrypoint-initdb.d/*; do
                  [ -e "$init_file" ] || continue
                  case "$init_file" in
                    *.sh) /bin/sh "$init_file" ;;
                    *.sql) psql --host=/var/run/postgresql --username="$owner_user" --dbname="$owner_database" --set=ON_ERROR_STOP=1 --file="$init_file" ;;
                    *) printf 'unsupported database init file: %s\n' "$init_file" >&2; exit 1 ;;
                  esac
                done
                pg_ctl --pgdata="$PGDATA" --mode=fast --wait stop
              fi

              rm -f "$password_file"
              trap - EXIT HUP INT TERM
              exec postgres \
                --config-file="$PGDATA/postgresql.conf" \
                -c listen_addresses='*' \
                -c unix_socket_directories=/var/run/postgresql
          env:
            - { name: POSTGRES_USER_FILE, value: /var/run/secrets/codeops-session-proof-owner/username }
            - { name: POSTGRES_PASSWORD_FILE, value: /var/run/secrets/codeops-session-proof-owner/password }
            - { name: POSTGRES_DB_FILE, value: /var/run/secrets/codeops-session-proof-owner/database }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          startupProbe: { exec: { command: [pg_isready, -h, 127.0.0.1, -U, codeops_session_broker_owner, -d, codeops_session_proof] }, periodSeconds: 2, failureThreshold: 90 }
          readinessProbe: { exec: { command: [pg_isready, -h, 127.0.0.1, -U, codeops_session_broker_owner, -d, codeops_session_proof] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -h, 127.0.0.1, -U, codeops_session_broker_owner, -d, codeops_session_proof] }, periodSeconds: 10, failureThreshold: 6 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: temp, mountPath: /tmp }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: owner, mountPath: /var/run/secrets/codeops-session-proof-owner, readOnly: true }
            - { name: runtime-database, mountPath: /var/run/secrets/codeops-session-runtime-database, readOnly: true }
      volumes:
        - { name: data, emptyDir: { sizeLimit: 2Gi } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - { name: temp, emptyDir: { sizeLimit: 64Mi } }
        - name: init
          configMap: { name: codeops-session-proof-database-init, defaultMode: 365 }
        - name: owner
          secret:
            secretName: codeops-session-proof-database-owner
            defaultMode: 256
            items: [{ key: username, path: username }, { key: password, path: password }, { key: database, path: database }]
        - name: runtime-database
          secret:
            secretName: codeops-session-runtime-worker-database
            defaultMode: 256
            items: [{ key: password, path: password }]
---
apiVersion: v1
kind: Service
metadata:
  name: codeops-session-proof-database
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: codeops-session-proof-database }
  ports: [{ name: postgres, protocol: TCP, port: 5432, targetPort: postgres }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-session-proof-database
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: codeops-session-proof-database }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: codeops-control-gateway } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: codeops-session-runtime-worker } }
      ports: [{ protocol: TCP, port: 5432 }]
  egress: []
