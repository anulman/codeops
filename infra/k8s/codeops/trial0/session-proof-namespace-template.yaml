apiVersion: v1
kind: Namespace
metadata:
  name: __CODEOPS_SESSION_PROOF_NAMESPACE__
  labels:
    app.kubernetes.io/part-of: codeops-session-proof
    codeops.renoconcierge.ca/proof-run: __CODEOPS_RUN_ID__
    codeops.renoconcierge.ca/base-sha: __CODEOPS_BASE_SHA__
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: codeops-session-proof
  namespace: __CODEOPS_SESSION_PROOF_NAMESPACE__
spec:
  limits:
    - type: Container
      min: { cpu: 10m, memory: 16Mi }
      max: { cpu: "4", memory: 8Gi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { cpu: 500m, memory: 512Mi }
    - type: PersistentVolumeClaim
      min: { storage: 1Mi }
      max: { storage: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: codeops-session-proof
  namespace: __CODEOPS_SESSION_PROOF_NAMESPACE__
spec:
  hard:
    pods: "12"
    count/deployments.apps: "4"
    count/jobs.batch: "8"
    count/services: "6"
    count/secrets: "16"
    count/configmaps: "16"
    count/persistentvolumeclaims: "1"
    requests.cpu: "6"
    requests.memory: 12Gi
    requests.storage: 2Gi
    limits.cpu: "12"
    limits.memory: 24Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: __CODEOPS_SESSION_PROOF_NAMESPACE__
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
