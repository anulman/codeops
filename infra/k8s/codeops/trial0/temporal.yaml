apiVersion: v1
kind: ServiceAccount
metadata:
  name: codeops-temporal
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codeops-temporal-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cinder-high-speed
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeops-temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codeops-temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codeops-temporal
        app.kubernetes.io/part-of: codeops-trial0
    spec:
      serviceAccountName: codeops-temporal
      automountServiceAccountToken: false
      nodeSelector:
        codeops.example/codeops: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: docker.io/temporalio/admin-tools@sha256:7e5820112475b3490f011b28d86ca9fd8348f1640b8dd04c62adb906e6b28cb2
          imagePullPolicy: IfNotPresent
          args:
            - temporal
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --port
            - "7233"
            - --ui-ip
            - 0.0.0.0
            - --ui-port
            - "8233"
            - --metrics-port
            - "9090"
            - --db-filename
            - /var/lib/temporal/temporal.db
            - --namespace
            - codeops
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
            - name: metrics
              containerPort: 9090
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/temporal
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: codeops-temporal-data
---
apiVersion: v1
kind: Service
metadata:
  name: codeops-temporal
spec:
  selector:
    app.kubernetes.io/name: codeops-temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
    - name: ui
      port: 8233
      targetPort: ui
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codeops-temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codeops-temporal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-orchestrator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: codeops-plane-controller
      ports:
        - protocol: TCP
          port: 7233
