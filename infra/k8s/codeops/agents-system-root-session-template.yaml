apiVersion: batch/v1
kind: Job
metadata:
  name: agents-root-__CODEOPS_SESSION_SUFFIX__
  namespace: agents-system
  labels:
    app.kubernetes.io/name: agents-system-runtime
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: agents-system
    codeops.example/session-id: __CODEOPS_SESSION_ID__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-system-runtime
        app.kubernetes.io/component: runtime
        app.kubernetes.io/part-of: agents-system
        codeops.example/session-id: __CODEOPS_SESSION_ID__
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 960
      serviceAccountName: agents-system-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{ name: codeops-registry }]
      nodeSelector: { codeops.example/codeops: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: workspace-builder
          image: ghcr.io/anulman/codeops/agent@__CODEOPS_AGENT_DIGEST__
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ceu]
          args:
            - |
              auth="$(printf 'x-access-token:%s' "$CODEOPS_REPOSITORY_READ_TOKEN" | base64 | tr -d '\n')"
              git init /workspace
              git -c safe.directory=/workspace -C /workspace remote add origin "$CODEOPS_SESSION_REPOSITORY"
              git -c safe.directory=/workspace -C /workspace -c "http.extraHeader=Authorization: Basic $auth" fetch --depth=1 origin "$CODEOPS_SESSION_BASE_SHA"
              unset auth CODEOPS_REPOSITORY_READ_TOKEN
              git -c safe.directory=/workspace -C /workspace checkout --detach FETCH_HEAD
              git -c safe.directory=/workspace -C /workspace remote remove origin
              test "$(git -c safe.directory=/workspace -C /workspace rev-parse HEAD)" = "$CODEOPS_SESSION_BASE_SHA"
              mkdir -p /workspace/.codeops/codex-home
              chmod 700 /workspace/.codeops/codex-home
          env:
            - { name: CODEOPS_SESSION_REPOSITORY, value: https://github.com/example-org/example-repository }
            - { name: CODEOPS_SESSION_BASE_SHA, value: __CODEOPS_BASE_SHA__ }
            - name: CODEOPS_REPOSITORY_READ_TOKEN
              valueFrom:
                secretKeyRef: { name: agents-system-runtime-source, key: repository-read-token }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: temp, mountPath: /tmp }
      containers:
        - name: runtime-worker
          image: ghcr.io/anulman/codeops/session-runtime-worker@__CODEOPS_SESSION_RUNTIME_WORKER_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - { name: CODEOPS_SESSION_RUNTIME_GATEWAY_ORIGIN, value: http://agents-session-control-gateway:8080 }
            - { name: CODEOPS_SESSION_RUNTIME_WORKER_TOKEN_FILE, value: /var/run/secrets/agents-system/runtime-worker-token }
            - { name: CODEOPS_SESSION_JOB_INITIALIZATION_TOKEN_FILE, value: /var/run/secrets/agents-system/initialization-token }
            - { name: CODEOPS_DATABASE_URL_FILE, value: /var/run/secrets/agents-system/database-url }
            - { name: CODEOPS_SESSION_RUNTIME_ACP_SOCKET_PATH, value: /run/codeops/agent.sock }
            - { name: CODEOPS_SESSION_RUNTIME_WORKSPACE, value: /workspace }
            - { name: CODEOPS_SESSION_RUNTIME_ACP_STATE_PATH, value: /var/lib/codeops-session/state.json }
            - { name: CODEOPS_SESSION_ID, value: __CODEOPS_SESSION_ID__ }
            - { name: CODEOPS_SESSION_OWNER_PRINCIPAL_ID, value: "__CODEOPS_SESSION_OWNER_PRINCIPAL_ID__" }
            - { name: CODEOPS_SESSION_REPOSITORY, value: example-org/example-repository }
            - { name: CODEOPS_SESSION_BRANCH, value: __CODEOPS_BRANCH__ }
            - { name: CODEOPS_SESSION_BASE_SHA, value: __CODEOPS_BASE_SHA__ }
            - { name: CODEOPS_SESSION_WORKFLOW_ID, value: __CODEOPS_WORKFLOW_ID__ }
            - { name: CODEOPS_SESSION_RUN_ID, value: __CODEOPS_RUN_ID__ }
            - { name: CODEOPS_SESSION_LEASE_ID, value: __CODEOPS_LEASE_ID__ }
            - { name: CODEOPS_SESSION_HOLDER_ID, value: session-job:__CODEOPS_SESSION_ID__ }
          readinessProbe:
            exec:
              command: [node, -e, "process.exit(require('node:fs').existsSync('/run/codeops/ready') ? 0 : 1)"]
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: session, mountPath: /run/codeops }
            - { name: session-state, mountPath: /var/lib/codeops-session }
            - { name: temp, mountPath: /tmp }
            - { name: session-secrets, mountPath: /var/run/secrets/agents-system, readOnly: true }
        - name: coding-agent
          image: ghcr.io/anulman/codeops/agent@__CODEOPS_AGENT_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - { name: CODEX_HOME, value: /var/lib/codeops-agent/codex-home }
            - { name: CODEOPS_MODEL_PROXY_TOKEN_FILE, value: /run/codeops/model-proxy-token }
            - { name: DEFAULT_AUTH_REQUEST, value: '{"methodId":"api-key"}' }
            - { name: MODEL_PROVIDER, value: codeops_proxy }
            - { name: CODEOPS_MODEL_PROXY_ORIGIN, value: http://agents-system-model-proxy:8080 }
            - { name: CODEX_CONFIG, value: '{"model":"gpt-5.6-sol","model_reasoning_effort":"high","approvals_reviewer":"auto_review","web_search":"cached","model_provider":"codeops_proxy","model_providers":{"codeops_proxy":{"name":"CodeOps model proxy","base_url":"http://agents-system-model-proxy:8080/v1","env_key":"CODEX_API_KEY","wire_api":"responses"}}}' }
            - { name: CODEOPS_ACP_SOCKET, value: /run/codeops/agent.sock }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: workspace, mountPath: /var/lib/codeops-agent/codex-home, subPath: .codeops/codex-home, readOnly: false }
            - { name: session, mountPath: /run/codeops }
            - { name: temp, mountPath: /tmp }
      volumes:
        - { name: workspace, emptyDir: {} }
        - { name: session, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - { name: session-state, emptyDir: { sizeLimit: 16Mi } }
        - { name: temp, emptyDir: { sizeLimit: 256Mi } }
        - name: session-secrets
          secret:
            secretName: agents-system-session-secrets
            defaultMode: 256
            items:
              - { key: runtime-worker-token, path: runtime-worker-token }
              - { key: initialization-token, path: initialization-token }
              - { key: runtime-database-url, path: database-url }
